<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pillow Report</title>
<meta name="theme-color" content="#13233A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pillow Report">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="jspdf.umd.min.js"></script>
<style>
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
:root{
  --bg:#EDF1F5; --surface:#FFFFFF; --ink:#13233A; --muted:#5B6B80; --line:#D5DDE6;
  --accent:#0EA5E9; --accent-ink:#0B2340; --soft:#E3EBF4;
  --s0:#9AA7B6; --s1:#C2413B; --s2:#D9822B; --s3:#B8961C; --s4:#4E9A5B; --s5:#1F7A5C;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0E1621; --surface:#172231; --ink:#E6EDF5; --muted:#9AAABD; --line:#2A3A4E;
  --accent:#38BDF8; --accent-ink:#0B2340; --soft:#1E2E42;
}}
:root[data-theme="dark"]{
  --bg:#0E1621; --surface:#172231; --ink:#E6EDF5; --muted:#9AAABD; --line:#2A3A4E;
  --accent:#38BDF8; --accent-ink:#0B2340; --soft:#1E2E42;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
img{max-width:100%;display:block}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:60px}
.bar h1{font-size:1.15rem;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.home-foot{display:flex;justify-content:center;padding:28px 0 8px;opacity:.85}
.home-foot svg{width:84px;height:60px}
.brand svg{flex:none}
.icon-btn{border:0;background:none;padding:8px;margin:-8px;border-radius:8px;font-size:1.3rem;line-height:1;display:inline-flex;align-items:center;justify-content:center;color:inherit}
main{max-width:760px;margin:0 auto;padding:16px 16px 120px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 16px;font-weight:700;min-height:48px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--s1)}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;color:var(--accent);padding:4px 0;font-weight:700}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.panel h2{font-size:1.1rem;margin:0 0 4px}
.hint{color:var(--muted);font-size:.9rem;margin:0}
label.f{display:block;margin-top:12px;font-size:.9rem;color:var(--muted)}
label.f input,label.f textarea,label.f select,.inp{display:block;width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:1rem;color:var(--ink)}
textarea{resize:vertical;min-height:72px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid2>*{min-width:0}
.grid2 input,.grid2 select{max-width:100%}
.grid3{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:0 8px;margin-top:4px}
.grid3>*{min-width:0}

/* Home list */
.swipe-row{position:relative;overflow:hidden;border-radius:14px;margin-bottom:10px}
.swipe-del{position:absolute;top:0;right:0;bottom:0;width:88px;border:0;background:var(--s1);color:#fff;font-weight:700;font-size:.75rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.survey-row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:0;position:relative;z-index:1;touch-action:pan-y;transition:transform .2s}
.survey-row .t{flex:1;min-width:0}
.survey-row .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.survey-row .t span{color:var(--muted);font-size:.9rem}
.status{font-size:.8rem;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted);margin-left:6px}
.status.sent{color:var(--s5)}

/* The signature element: the score stamp */
.stamp{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.15rem;color:#fff;background:var(--s0);font-variant-numeric:tabular-nums}
.stamp.big{width:84px;height:84px;font-size:1.7rem}
.stamp[data-s="1"]{background:var(--s1)}.stamp[data-s="2"]{background:var(--s2)}.stamp[data-s="3"]{background:var(--s3)}.stamp[data-s="4"]{background:var(--s4)}.stamp[data-s="5"]{background:var(--s5)}

.summary{display:flex;align-items:center;gap:16px}
.summary .txt{flex:1}
.progress{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}

/* Category */
.cat-head{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:0;text-align:left}
.cat-head h2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{color:var(--muted);flex:none;transition:transform .15s}
.cat-head[aria-expanded="true"] .chev,.acc-head[aria-expanded="true"] .chev{transform:rotate(180deg)}
.sec-body{padding-top:10px}
.acc{border:1px solid var(--line);border-radius:10px;margin-top:10px;overflow:hidden}
.acc:first-child{margin-top:0}
.acc-head{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:var(--bg);padding:10px 12px;font-weight:700;text-align:left}
.acc-body{padding:12px}
.cat-avg{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.item{padding:14px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item-label{font-weight:700;margin-bottom:8px}
.scores{display:grid;grid-template-columns:1.3fr repeat(5,1fr);gap:6px}
.scores button{min-height:46px;border:1px solid var(--line);background:var(--bg);border-radius:9px;font-weight:700;font-size:1rem;padding:0}
.scores button.na{font-size:.8rem;font-weight:400;color:var(--muted)}
.scores button[aria-pressed="true"]{color:#fff;border-color:transparent;background:var(--s0)}
.scores button[data-v="1"][aria-pressed="true"]{background:var(--s1)}
.scores button[data-v="2"][aria-pressed="true"]{background:var(--s2)}
.scores button[data-v="3"][aria-pressed="true"]{background:var(--s3)}
.scores button[data-v="4"][aria-pressed="true"]{background:var(--s4)}
.scores button[data-v="5"][aria-pressed="true"]{background:var(--s5)}
.score-word{font-size:.85rem;color:var(--muted);margin-top:6px;min-height:1.3em}
.note{margin-top:8px}
.note[hidden]{display:none}

.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:12px}
.photo{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1;background:var(--soft)}
.photo img{width:100%;height:100%;object-fit:cover}
.photo button{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:1rem;line-height:1}
.add-photo{display:flex;align-items:center;justify-content:center;gap:8px;border:1px dashed var(--line);border-radius:10px;padding:12px;margin-top:12px;color:var(--accent);font-weight:700;cursor:pointer}
.add-photo input{position:absolute;width:1px;height:1px;opacity:0}

.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:10}
.dock-in{max-width:760px;margin:0 auto;display:flex;gap:10px}
.dock-in .btn{flex:1}

/* Report */
.bars{margin-top:8px}
.barrow{display:grid;grid-template-columns:minmax(110px,1.2fr) 2fr 40px;gap:10px;align-items:center;padding:6px 0;font-size:.95rem}
.barrow .track{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.barrow .track i{display:block;height:100%;border-radius:99px}
.barrow b{text-align:right;font-variant-numeric:tabular-nums}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--accent);flex:none}
.check small{display:block;color:var(--muted);word-break:break-all}
.actions{display:grid;gap:10px}
.lowlist{margin:8px 0 0;padding-left:18px}
.lowlist li{margin:4px 0}

.empty{text-align:center;padding:48px 16px}
.empty p{color:var(--muted);max-width:34ch;margin:8px auto 20px}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;max-width:min(90vw,480px);z-index:30;font-size:.95rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:420px){.grid2{grid-template-columns:1fr}.scores{grid-template-columns:repeat(6,1fr)}.scores button.na{font-size:.7rem}}

/* Checklist fields */
.field{padding:14px 0;border-top:1px solid var(--line)}
.field:first-of-type{border-top:0}
.field-label{font-weight:700;margin-bottom:8px;display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.field-label .flagtag{font-size:.8rem;font-weight:700;color:#fff;background:var(--s1);border-radius:99px;padding:1px 8px;white-space:nowrap}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{min-height:44px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:0 14px;font-weight:700}
.opts button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opts button.bad[aria-pressed="true"]{background:var(--s1);border-color:var(--s1);color:#fff}
.opts.multi button[aria-pressed="true"]::before{content:"✓ "}
.sub{margin-top:8px}
.slider-val{font-weight:700;margin-bottom:6px}
.slider input[type=range]{width:100%;accent-color:var(--accent)}
.slider-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-top:2px}
.standard{margin-top:8px}
.standard summary{cursor:pointer;font-weight:700;font-size:.85rem;color:var(--accent);list-style:none;display:inline-flex;align-items:center;gap:4px}
.standard summary::-webkit-details-marker{display:none}
.standard summary::before{content:"ℹ️";font-size:.9em}
.standard p{margin:6px 0 0;padding:10px 12px;background:var(--soft);border-radius:10px;font-size:.85rem;color:var(--ink);line-height:1.5}
.fnote{margin-top:8px}
.fnote-head{display:flex;justify-content:flex-end}
.fnote-head .link{font-size:.85rem;padding:2px 0}
.fn-row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-top:8px}
.fn-score{flex:1;min-width:160px}
.fn-lbl{display:block;font-size:.85rem;color:var(--muted);margin-bottom:2px}
.fn-lbl b{color:var(--ink)}
.fn-score input[type=range]{width:100%;accent-color:var(--accent)}
.fn-comp{flex:none}
.ta-wrap{position:relative}
.ta-list{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;max-height:220px;overflow-y:auto;z-index:6;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.ta-list button{display:block;width:100%;text-align:left;border:0;background:none;border-top:1px solid var(--line);padding:10px 12px;font-weight:400}
.ta-list button:first-child{border-top:0}
.rest{display:grid;grid-template-columns:1fr;gap:6px;padding:8px 0}
.chips{display:flex;gap:8px;overflow-x:auto;margin:14px -16px -4px;padding:0 16px 4px;scrollbar-width:none}
.chips button{flex:none;border:0;color:var(--ink);background:var(--soft);border-radius:99px;padding:6px 12px;font-size:.85rem;white-space:nowrap}
.chips button b{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:400;margin-left:4px}
.chips button.has-flag b{color:var(--s1);font-weight:700}
.sec-meta{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums;flex:none;min-width:64px;text-align:right}
.sec-meta .fl{color:var(--s1);font-weight:700}
.stamp[data-s="ok"]{background:var(--s5)}.stamp[data-s="warn"]{background:var(--s2)}.stamp[data-s="bad"]{background:var(--s1)}
</style>
</head>
<body>
<header class="bar"><div class="bar-in" id="bar"></div></header>
<main id="app"></main>
<div class="dock" id="dock" hidden><div class="dock-in" id="dockIn"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Checklist: follows Survey_Checklist_2025 ----------
   type: text | area | choice | multi | pair | restaurants | slider | mealtimes
   detail.type: choice | search | (text, default)
   flag: answers that count as a finding (shown in red, listed in report)
   scores/compliance: optional 0-10 score and compliant/non-compliant judgement per field, set via "+ opmerking"   */
const YN=['Yes','No'], CMP=['Compliant','Not compliant'];
const ICON={
  trash:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>',
  settings:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82A1.65 1.65 0 0 0 3 13.09H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
  mark:'<svg width="34" height="24" viewBox="0 0 212 152" aria-hidden="true"><rect x="0" y="0" width="212" height="152" rx="40" fill="#0EA5E9"/><rect x="14" y="14" width="184" height="124" rx="28" fill="none" stroke="#fff" stroke-width="6" stroke-dasharray="10 9"/><rect x="66" y="26" width="80" height="100" rx="22" fill="#fff"/><path d="M83 76 L101 94 L131 56" fill="none" stroke="#0EA5E9" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  book:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>',
  share:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v14"/></svg>'
};
const AIRLINES=['Aegean Airlines','Aer Lingus','Aeroflot','Aeromexico','Air Algerie','Air Astana','Air Baltic','Air Canada','Air China','Air Europa','Air France','Air India','Air New Zealand','Air Serbia','Air Transat','Alaska Airlines','Alitalia (ITA Airways)','All Nippon Airways (ANA)','American Airlines','Asiana Airlines','Austrian Airlines','Avianca','Azerbaijan Airlines','Bangkok Airways','Batik Air','British Airways','Brussels Airlines','Bulgaria Air','Cathay Pacific','Cebu Pacific','China Airlines','China Eastern Airlines','China Southern Airlines','Condor','Copa Airlines','Croatia Airlines','Delta Air Lines','EgyptAir','EL AL','Emirates','Ethiopian Airlines','Etihad Airways','Eurowings','EVA Air','Finnair','flydubai','Garuda Indonesia','Gulf Air','Hainan Airlines','Hawaiian Airlines','Hong Kong Airlines','Iberia','Icelandair','IndiGo','Japan Airlines (JAL)','Jet2','JetBlue','Jetstar Airways','Juneyao Airlines','Kenya Airways','KLM Royal Dutch Airlines','Korean Air','Kuwait Airways','LATAM Airlines','LOT Polish Airlines','Lufthansa','Luxair','Malaysia Airlines','Malta Air','Middle East Airlines','Norwegian Air','Oman Air','Pakistan International Airlines','Pegasus Airlines','Philippine Airlines','Qantas','Qatar Airways','Royal Air Maroc','Royal Brunei Airlines','Royal Jordanian','RwandAir','Ryanair','SAS Scandinavian Airlines','Saudia','Scoot','Shenzhen Airlines','Singapore Airlines','South African Airways','Southwest Airlines','SpiceJet','Spirit Airlines','SriLankan Airlines','Sun Country Airlines','Swiss International Air Lines','TAAG Angola Airlines','TAP Air Portugal','Thai Airways','Transavia','Tunisair','Turkish Airlines','Ukraine International Airlines','United Airlines','Uzbekistan Airways','Vietnam Airlines','Virgin Atlantic','Virgin Australia','Vistara','Vueling','WestJet','Wizz Air','Xiamen Airlines'];
const SECTIONS = [
  {id:'general', name:'General', fields:[
    {id:'constructionYear', label:'Construction year', type:'text', mode:'numeric'},
    {id:'renovation', label:'Last major renovation', type:'text', mode:'numeric'},
    {id:'numRooms', label:'Number of rooms', type:'text', mode:'numeric'},
    {id:'numFloors', label:'Number of floors', type:'text', mode:'numeric'},
    {id:'connecting', label:'Connecting doors', type:'choice', options:['Yes','No'], detail:{when:'Yes', type:'choice', options:['Able to exclude','Not able to exclude'], flag:['Not able to exclude']}, standard:"Kamers met connecting doors dienen te worden uitgesloten, tenzij partijen onderling anders beslissen. Deuren met een connecting door dienen aan beide zijden een slot te hebben."},
    {id:'guests', label:'Guests', type:'slider', min:0, max:100, step:5, left:'Business', right:'Leisure'},
    {id:'management', label:'Management', type:'text'},
    {id:'airlineExp', label:'Airline experience', type:'choice', options:YN, detail:{when:'Yes', type:'search'}}]},
  {id:'facilities', name:'Facilities', fields:[
    {id:'mealHours', label:'Meal times', type:'mealtimes', meals:['Breakfast','Lunch','Dinner'], days:['Mo-Fri','Sa-Su'], standard:"Artikel 2c: dinertijden — voor crews die met de vroege vlucht vertrekken moet de avond voorafgaand tussen 17.00-19.00 uur LT gedineerd kunnen worden. Ontbijttijden Europa: het hotel regelt een ontbijt voor de vroegst vertrekkende crew. Oostelijk gelegen stations (tijdsverschil ≥5 uur): ontbijt tot 15:00 lokale tijd op rekening van KLM."},
    {id:'breakfastType', label:'Breakfast type', type:'choice', options:['Buffet','A la carte','Other'], other:'Other', standard:"Artikel 3a — norm ontbijt: vruchtensap, 2 eieren met ham, brood, boter en thee of koffie."},
    {id:'extBreakfast', label:'Extended breakfast', type:'choice', options:YN},
    {id:'roomService', label:'Room service', type:'choice', options:['24 hrs','Limited hours','No room service'], detail:{when:'Limited hours', label:'Hours'}},
    {id:'trayCharge', label:'Room service tray charge', type:'choice', options:YN},
    {id:'restaurants', label:'Restaurants', type:'restaurants', rows:3, meals:['Lunch','Dinner','All-day']},
    {id:'bar', label:'Bar', type:'text'},

/* ---------- Storage (IndexedDB, falls back to memory) ---------- */
const store = {
  db:null, mem:{},
  open(){ return new Promise(res=>{ try{ const r=indexedDB.open('hotel-survey',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');
    r.onsuccess=()=>{this.db=r.result;res()}; r.onerror=()=>res(); }catch(e){res()} }); },
  get(k){ if(!this.db) return Promise.resolve(this.mem[k]); return new Promise(res=>{ try{
    const q=this.db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(undefined);}catch(e){res(undefined)} }); },
  set(k,v){ this.mem[k]=v; if(!this.db) return Promise.resolve(); return new Promise(res=>{ try{
    const t=this.db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=()=>res(); t.onerror=()=>{toast('Opslaan mislukt: opslag van dit apparaat is vol of geblokkeerd.');res()}; }catch(e){res()} }); }
};

/* ---------- Helpers ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = ()=>Math.random().toString(36).slice(2,10);
const today = ()=>new Date().toISOString().slice(0,10);
const dateNL = d=>{ if(!d) return ''; const [y,m,dd]=d.split('-'); return `${dd}-${m}-${y}`; };
function dateSelectHTML(s){
  const [y,m,d]=(s.date||today()).split('-');
  const curY=new Date().getFullYear();
  const opt=(v,cur)=>`<option value="${v}" ${v===cur?'selected':''}>${v}</option>`;
  const days=Array.from({length:31},(_,i)=>opt(String(i+1).padStart(2,'0'),d)).join('');
  const months=Array.from({length:12},(_,i)=>opt(String(i+1).padStart(2,'0'),m)).join('');
  const years=Array.from({length:4},(_,i)=>opt(String(curY-2+i),y)).join('');
  return `<select class="inp" data-datepart="d" aria-label="Dag">${days}</select><select class="inp" data-datepart="m" aria-label="Maand">${months}</select><select class="inp" data-datepart="y" aria-label="Jaar">${years}</select>`;
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),3800); }
const cur = ()=>{ const s=S.surveys.find(x=>x.id===view.id); if(s){ s.scores=s.scores||{}; s.compliance=s.compliance||{}; if(s.caoAuto===undefined) s.caoAuto=true; if(s.driveTimeAuto===undefined) s.driveTimeAuto=true; if(s.airQualityAuto===undefined) s.airQualityAuto=true; if(s.address===undefined) s.address=''; } return s; };
const title = s=>s.hotel||'Naamloos hotel';
const nonEmpty = v=>Array.isArray(v)?v.length>0:(v!=null&&String(v).trim()!=='');

function filled(s,f){
  const v=s.f[f.id];
  if(f.type==='pair') return f.parts.some((_,i)=>nonEmpty(s.f[`${f.id}.${i}`]));
  if(f.type==='restaurants') return [...Array(f.rows)].some((_,i)=>nonEmpty(s.f[`${f.id}.${i}.name`]));
  if(f.type==='mealtimes') return f.meals.some((_,mi)=>f.days.some((_,di)=>nonEmpty(s.f[`${f.id}.${mi}.${di}.from`])||nonEmpty(s.f[`${f.id}.${mi}.${di}.to`])));
  return nonEmpty(v) || (f.extra && nonEmpty(s.f[f.id+'.extra']));
}
const isFlag = (s,f)=>(!!f.flag && f.flag.includes(s.f[f.id])) || (!!f.detail?.flag && s.f[f.id]===f.detail.when && f.detail.flag.includes(s.f[f.id+'.detail']));
const flags = s=>ALL.filter(f=>isFlag(s,f));
const doneCount = (s,fs=ALL)=>fs.filter(f=>filled(s,f)).length;
function verdict(s){ const c=s.f.cao, n=flags(s).length;
  if(c==='No') return {k:'bad', t:'!', w:'Niet CAO-compliant'};
  if(n) return {k:'warn', t:String(n), w:`${n} bevinding${n>1?'en':''}`};
  if(c==='Yes') return {k:'ok', t:'✓', w:'CAO-compliant'};
  return {k:'0', t:'–', w:'CAO nog niet beoordeeld'}; }
function avgScore(s){ const vals=Object.values(s.scores||{}).filter(v=>v!=null); return vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null; }
function sectionCompliance(s,sec){ const vals=sec.fields.map(f=>s.compliance?.[f.id]).filter(Boolean);
  if(vals.includes('Non-compliant')) return 'Non-compliant';
  if(vals.includes('Compliant')) return 'Compliant';
  return 'Not assessed'; }

const sliderText = (f,val)=>`${val}% ${f.left} · ${100-val}% ${f.right}`;

/* Human-readable value (used in report, mail and PDF) */
function valueText(s,f){
  const v=s.f[f.id];
  if(f.type==='pair') return f.parts.map((p,i)=>nonEmpty(s.f[`${f.id}.${i}`])?`${p}: ${s.f[`${f.id}.${i}`]}`:'').filter(Boolean).join('  |  ');
  if(f.type==='restaurants') return [...Array(f.rows)].map((_,i)=>{ const n=s.f[`${f.id}.${i}.name`]; if(!nonEmpty(n)) return ''; const m=s.f[`${f.id}.${i}.meals`]||[]; return n+(m.length?` (${m.join(', ')})`:''); }).filter(Boolean).join('\n');
  if(f.type==='slider') return nonEmpty(v) ? sliderText(f,Number(v)) : '';
  if(f.type==='mealtimes') return f.meals.map((meal,mi)=>{
    const parts=f.days.map((day,di)=>{ const from=s.f[`${f.id}.${mi}.${di}.from`],to=s.f[`${f.id}.${mi}.${di}.to`];
      return (nonEmpty(from)||nonEmpty(to))?`${day} ${from||'?'}-${to||'?'}`:''; }).filter(Boolean).join(', ');
    return parts?`${meal}: ${parts}`:''; }).filter(Boolean).join('\n');
  let t = Array.isArray(v)? v.join(', ') : (v||'');
  if(f.other && (Array.isArray(v)?v.includes(f.other):v===f.other) && nonEmpty(s.f[f.id+'.other'])) t+=`: ${s.f[f.id+'.other']}`;
  if(f.detail && v===f.detail.when && nonEmpty(s.f[f.id+'.detail'])){
    const dv=s.f[f.id+'.detail'];
    let dt=Array.isArray(dv)?dv.join(', '):dv;
    if(f.detail.other && Array.isArray(dv) && dv.includes(f.detail.other) && nonEmpty(s.f[f.id+'.detail.other'])) dt+=`: ${s.f[f.id+'.detail.other']}`;
    t+=` (${dt})`;
  }
  if(f.extra && nonEmpty(s.f[f.id+'.extra'])) t+=`${t?'  |  ':''}${f.extra}: ${s.f[f.id+'.extra']}`;
  return t;
}

function fieldHTML(s,f){
  const k=f.id, v=s.f[k], flagged=isFlag(s,f);
  let body='';
  if(f.type==='text') body=`<input class="inp" data-k="${k}" value="${esc(v)}" ${f.mode?`inputmode="${f.mode}"`:''} placeholder="${esc(f.ph||'')}" aria-label="${esc(f.label)}">`;
  else if(f.type==='area') body=`<textarea class="inp" data-k="${k}" rows="3" aria-label="${esc(f.label)}">${esc(v)}</textarea>`;
  else if(f.type==='pair') body=`<div class="grid2">${f.parts.map((p,i)=>`<label class="f" style="margin-top:0">${p}<input data-k="${k}.${i}" value="${esc(s.f[`${k}.${i}`])}" placeholder="${esc(f.ph)}"></label>`).join('')}</div>`;
  else if(f.type==='restaurants') body=[...Array(f.rows)].map((_,i)=>{ const m=s.f[`${k}.${i}.meals`]||[];
    return `<div class="rest"><input class="inp" data-k="${k}.${i}.name" value="${esc(s.f[`${k}.${i}.name`])}" placeholder="Restaurant ${i+1}" aria-label="Restaurant ${i+1}">

/* ---------- Driving time to airport (best-effort, via OpenStreetMap/OSRM) ---------- */
let airportsData=null;
async function loadAirportsData(){
  if(airportsData) return airportsData;
  const cached=await store.get('airportsData');
  if(cached){ airportsData=cached; return airportsData; }
  if(!navigator.onLine) return null;
  try{
    const res=await fetch('https://raw.githubusercontent.com/mwgg/Airports/master/airports.json');
    if(!res.ok) throw 0;
    const data=await res.json();
    airportsData=data; store.set('airportsData',data);
    return airportsData;
  }catch(e){ return null; }
}
function findAirportByIata(data,code){
  if(!data||!code) return null;
  const up=code.trim().toUpperCase();
  return Object.values(data).find(a=>a.iata===up)||null;
}
async function geocode(query){
  const res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`);
  if(!res.ok) throw 0;
  const list=await res.json();
  if(!list.length) return null;
  return {lat:parseFloat(list[0].lat), lon:parseFloat(list[0].lon)};
}
function formatDuration(sec){
  const mins=Math.round(sec/60);
  if(mins<60) return `${mins} min`;
  const h=Math.floor(mins/60), m=mins%60;
  return `${h}h${m?' '+m+'min':''}`;
}
let driveTimer=null;
function scheduleDriveTimeLookup(s){
  clearTimeout(driveTimer);
  if(!S.autoDriveTime || s.driveTimeAuto===false) return;
  const addr=(s.address||'').trim(), code=(s.city||'').trim();
  if(addr.length<5 || code.length!==3) return;
  driveTimer=setTimeout(()=>tryFetchDriveTime(s),800);
}
let hotelSuggestTimer=null, hotelSuggestCache=[];
function scheduleHotelSuggest(s){
  clearTimeout(hotelSuggestTimer);
  const box=document.querySelector('[data-hotel-suggest]');
  const q=(s.hotel||'').trim();
  if(!S.autoAddress || q.length<3){ if(box){box.hidden=true; box.innerHTML='';} return; }
  hotelSuggestTimer=setTimeout(()=>fetchHotelSuggestions(s,q),450);
}
async function fetchHotelSuggestions(s,q){
  if(!navigator.onLine) return;
  const box=document.querySelector('[data-hotel-suggest]'); if(!box) return;
  try{
    let searchQ=q;
    const code=(s.city||'').trim();
    if(code.length===3){ const airports=await loadAirportsData(); const airport=findAirportByIata(airports,code); if(airport?.city) searchQ=`${q}, ${airport.city}`; }
    const res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=5&namedetails=1&q=${encodeURIComponent(searchQ)}`);
    if(!res.ok) throw 0;
    const list=await res.json();
    if((s.hotel||'').trim()!==q) return;
    hotelSuggestCache=list;
    if(!list.length){ box.hidden=true; box.innerHTML=''; return; }
    box.innerHTML=list.map((hit,i)=>{ const name=hit.namedetails?.name||hit.display_name.split(',')[0];
      return `<button type="button" data-a="pickhotel" data-i="${i}"><b>${esc(name)}</b><br><span class="hint">${esc(hit.display_name)}</span></button>`; }).join('');
    box.hidden=false;
  }catch(e){ box.hidden=true; }
}
let gmapsLoading=null;
function loadGoogleMaps(){
  if(window.google?.maps?.DirectionsService) return Promise.resolve(true);
  if(!S.googleMapsKey) return Promise.resolve(false);
  if(gmapsLoading) return gmapsLoading;
  gmapsLoading=new Promise(resolve=>{
    try{
      const script=document.createElement('script');
      script.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(S.googleMapsKey)}&loading=async`;
      script.async=true;
      script.onload=()=>resolve(!!window.google?.maps?.DirectionsService);
      script.onerror=()=>resolve(false);
      document.head.appendChild(script);
    }catch(e){ resolve(false); }
  });
  return gmapsLoading;
}
function googleDrivingSeconds(from,to){
  return new Promise(resolve=>{
    try{
      new google.maps.DirectionsService().route({
        origin:{lat:from.lat,lng:from.lon}, destination:{lat:to.lat,lng:to.lon},
        travelMode:google.maps.TravelMode.DRIVING,
        drivingOptions:{departureTime:new Date(),trafficModel:'bestguess'}
      }, (result,status)=>{
        const leg=status==='OK'?result?.routes?.[0]?.legs?.[0]:null;
        resolve({seconds:leg?(leg.duration_in_traffic||leg.duration).value:null, status});
      });
    }catch(e){ resolve({seconds:null, status:'EXCEPTION: '+e}); }
  });
}
async function tryFetchDriveTime(s){
  if(!S.autoDriveTime || s.driveTimeAuto===false || !navigator.onLine) return;
  const addr=(s.address||'').trim(), code=(s.city||'').trim();
  if(addr.length<5 || code.length!==3) return;
  try{
    const airports=await loadAirportsData();
    const airport=findAirportByIata(airports,code);
    if(!airport||airport.lat==null||airport.lon==null) return;
    const hotelLoc=(s.hotelLat!=null && s.hotelLon!=null) ? {lat:s.hotelLat, lon:s.hotelLon} : await geocode(addr);
    if(!hotelLoc) return;
    let dur=null, viaGoogle=false; s.driveTimeGoogleError=null;
    if(S.googleMapsKey){
      if(await loadGoogleMaps()){
        const g=await googleDrivingSeconds(hotelLoc,{lat:airport.lat,lon:airport.lon});
        if(g.seconds!=null){ dur=g.seconds; viaGoogle=true; } else { s.driveTimeGoogleError=g.status||'onbekende fout'; }
      } else s.driveTimeGoogleError='kon de Google Maps-bibliotheek niet laden (controleer de sleutel)';
    }
    if(dur==null){
      const res=await fetch(`https://router.project-osrm.org/route/v1/driving/${hotelLoc.lon},${hotelLoc.lat};${airport.lon},${airport.lat}?overview=false`);
      if(!res.ok) throw 0;
      const data=await res.json();
      dur=data?.routes?.[0]?.duration;
    }
    if(dur==null) return;
    if((s.address||'').trim()!==addr || (s.city||'').trim()!==code) return;
    s.f.driveTime=formatDuration(dur);
    s.driveTimeSource=viaGoogle?'google':'osrm';
    touch(s);
    if(view.name==='edit'&&view.id===s.id) rerenderField(s,'driveTime');
  }catch(e){ /* stil negeren: geen internet, geen match, of de route-dienst antwoordt niet */ }
}

/* ---------- Air quality at destination (best-effort, via WAQI/aqicn.org) ---------- */
function aqiCategory(aqi){
  if(aqi<=50) return 'Good'; if(aqi<=100) return 'Moderate';
  if(aqi<=150) return 'Unhealthy for sensitive groups'; if(aqi<=200) return 'Unhealthy';
  if(aqi<=300) return 'Very unhealthy'; return 'Hazardous';
}
let aqiTimer=null;
function scheduleAirQualityLookup(s){
  clearTimeout(aqiTimer);
  if(!S.autoAirQuality || s.airQualityAuto===false) return;
  const addr=(s.address||'').trim(); if(addr.length<5) return;
  aqiTimer=setTimeout(()=>tryFetchAirQuality(s),800);
}
async function tryFetchAirQuality(s){
  if(!S.autoAirQuality || s.airQualityAuto===false || !navigator.onLine || !S.waqiToken) return;
  const addr=(s.address||'').trim(); if(addr.length<5) return;
  try{
    const hotelLoc=(s.hotelLat!=null && s.hotelLon!=null) ? {lat:s.hotelLat, lon:s.hotelLon} : await geocode(addr);
    if(!hotelLoc) return;
    const res=await fetch(`https://api.waqi.info/feed/geo:${hotelLoc.lat};${hotelLoc.lon}/?token=${encodeURIComponent(S.waqiToken)}`);
    if(!res.ok) throw 0;
    const data=await res.json();
    if(data.status!=='ok' || data.data?.aqi==null){ s.airQualityError=data.data||data.status; return; }
    if((s.address||'').trim()!==addr) return;
    const aqi=data.data.aqi;
    s.f.airQualityIndex=`AQI ${aqi} (${aqiCategory(aqi)})${data.data.dominentpol?' — '+data.data.dominentpol:''}`;
    s.airQualityError=null;
    touch(s);
    if(view.name==='edit'&&view.id===s.id) rerenderField(s,'airQualityIndex');
  }catch(e){ /* stil negeren */ }
}

/* ---------- Swipe to delete (home list) ---------- */
const SWIPE_W=88;
let swipe=null, suppressClick=false;
function closeSwipes(){ document.querySelectorAll('.swipe-row.open').forEach(w=>{ w.classList.remove('open'); w.querySelector('.survey-row').style.transform=''; }); }
function swipeStart(x,y,target){
  const row=target.closest('.survey-row'); const wrap=row?.closest('.swipe-row'); if(!wrap) return;
  document.querySelectorAll('.swipe-row.open').forEach(w=>{ if(w!==wrap){ w.classList.remove('open'); w.querySelector('.survey-row').style.transform=''; } });
  const wasOpen=wrap.classList.contains('open');
  swipe={row,wrap,startX:x,startY:y,dragging:false,base:wasOpen?-SWIPE_W:0,x:wasOpen?-SWIPE_W:0};
}
function swipeMove(x,y){
  if(!swipe) return;
  const dx=x-swipe.startX, dy=y-swipe.startY;
  if(!swipe.dragging){
    if(Math.abs(dy)>Math.abs(dx)){ swipe=null; return; }
    if(Math.abs(dx)<8) return;
    swipe.dragging=true; swipe.row.style.transition='none';
  }
  swipe.x=Math.max(-SWIPE_W-16,Math.min(0,swipe.base+dx));
  swipe.row.style.transform=`translateX(${swipe.x}px)`;
}
function swipeEnd(){
  if(!swipe) return;
  const {row,wrap,dragging,x}=swipe;
  row.style.transition='';
  if(dragging){
    const openNow = x < -SWIPE_W/2;
    row.style.transform = openNow? `translateX(-${SWIPE_W}px)` : '';
    wrap.classList.toggle('open',openNow);
    suppressClick=true; setTimeout(()=>suppressClick=false,0);
  }
  swipe=null;
}
if('ontouchstart' in window){
  document.addEventListener('touchstart', e=>{ const t=e.touches[0]; swipeStart(t.clientX,t.clientY,e.target); }, {passive:true});
  document.addEventListener('touchmove', e=>{ const t=e.touches[0]; swipeMove(t.clientX,t.clientY); }, {passive:true});
  document.addEventListener('touchend', swipeEnd);
} else {
  document.addEventListener('mousedown', e=>swipeStart(e.clientX,e.clientY,e.target));
  document.addEventListener('mousemove', e=>swipeMove(e.clientX,e.clientY));
  document.addEventListener('mouseup', swipeEnd);
}
document.addEventListener('click', e=>{
  if(!e.target.closest('.swipe-row')) closeSwipes();
  if(!e.target.closest('.ta-wrap')) document.querySelectorAll('.ta-list').forEach(b=>b.hidden=true);
});

/* ---------- Events ---------- */
document.addEventListener('click', e=>{
  if(suppressClick) return;
  const b=e.target.closest('[data-a]'); if(!b) return;
  const a=b.dataset.a, s=cur();
  if(a==='home'){view={name:'home'};render();}
  else if(a==='settings'){view={name:'settings'};render();}
  else if(a==='new'){
    const n={id:uid(),hotel:'',address:'',city:'',reps:S.defaultRep,date:today(),inspector:'',f:seedMealDefaults(FIELD.mealHours),notes:{},scores:{},compliance:{},caoAuto:true,driveTimeAuto:true,airQualityAuto:true,photos:[],status:'concept',updated:Date.now(),recip:{groups:[],extra:''}};
    S.surveys.push(n); persist(); view={name:'edit',id:n.id}; render();
  }
  else if(a==='open'){ const wrap=b.closest('.swipe-row'); if(wrap?.classList.contains('open')){ closeSwipes(); return; } view={name:'edit',id:b.dataset.id}; render(); }
  else if(a==='swipedelete'){ const sv=S.surveys.find(x=>x.id===b.dataset.id); if(sv && confirm(`Survey "${title(sv)}" verwijderen?`)){ S.surveys=S.surveys.filter(x=>x.id!==sv.id); persist(); render(); toast('Survey verwijderd'); } else closeSwipes(); }
  else if(a==='report'){view={name:'report',id:s.id};render();}
  else if(a==='back-edit'){view={name:'edit',id:s.id};render();}
  else if(a==='delete'){ if(confirm(`Survey "${title(s)}" verwijderen?`)){ S.surveys=S.surveys.filter(x=>x.id!==s.id); persist(); view={name:'home'}; render(); toast('Survey verwijderd'); } }
  else if(a==='sharesurvey') exportSurvey(s);
  else if(a==='pick'){ const id=b.dataset.id, v=b.dataset.v; if(id==='cao') s.caoAuto=false; s.f[id] = s.f[id]===v?undefined:v; if(s.f[id]===undefined) delete s.f[id]; touch(s); rerenderField(s,id); refreshStats(); }
  else if(a==='caoauto'){ s.caoAuto=true; touch(s); rerenderField(s,'cao'); refreshStats(); }
  else if(a==='drivetimeauto'){ s.driveTimeAuto=true; rerenderField(s,'driveTime'); scheduleDriveTimeLookup(s); }
  else if(a==='retrydrivetime'){ s.driveTimeAuto=true; s.driveTimeGoogleError=null; touch(s); rerenderField(s,'driveTime'); tryFetchDriveTime(s); }
  else if(a==='airqualityauto'){ s.airQualityAuto=true; rerenderField(s,'airQualityIndex'); scheduleAirQualityLookup(s); }
  else if(a==='retryairquality'){ s.airQualityAuto=true; s.airQualityError=null; touch(s); rerenderField(s,'airQualityIndex'); tryFetchAirQuality(s); }

function nonCompliantFields(s){ return ALL.filter(f=>f.id!=='cao' && (isFlag(s,f) || s.compliance?.[f.id]==='Non-compliant')); }
function updateCaoAuto(s){
  if(s.caoAuto===false) return false;
  const bad=nonCompliantFields(s).length>0;
  if(bad && s.f.cao!=='No'){ s.f.cao='No'; return true; }
  if(!bad && s.f.cao==='No'){ delete s.f.cao; return true; }
  return false;
}
function touch(s){ s.updated=Date.now(); const changed=updateCaoAuto(s); persist(); if(changed && view.name==='edit' && view.id===s.id) rerenderField(s,'cao'); }
function compress(file){ return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file); const img=new Image();
  img.onload=()=>{ const max=1280; let w=img.naturalWidth,h=img.naturalHeight; const r=Math.min(1,max/Math.max(w,h)); w=Math.round(w*r); h=Math.round(h*r);
    const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(url);
    res({data:c.toDataURL('image/jpeg',0.7),w,h}); };
  img.onerror=()=>{URL.revokeObjectURL(url);rej()}; img.src=url; }); }

/* ---------- Recipients & mail ---------- */
function recipients(s){
  const split=v=>(v||'').split(/[,;\s]+/).map(x=>x.trim()).filter(Boolean);
  const gs=S.groups.filter(g=>s.recip?.groups.includes(g.id));
  const to=[...new Set([...gs.flatMap(g=>split(g.to)),...split(s.recip?.extra)])];
  const cc=[...new Set(gs.flatMap(g=>split(g.cc)))].filter(x=>!to.includes(x));
  return {to,cc};
}
const caoText = s=>s.f.cao==='Yes'?'Yes':s.f.cao==='No'?'No':'Not assessed';
function subject(s){ return `Pillow Report ${title(s)}${s.city?' ('+s.city+')':''} - ${dateNL(s.date)}`; }
function mailBody(s){
  const fl=flags(s);
  const lines=[`Pillow Report: ${title(s)}${s.city?' ('+s.city+')':''}`,
    `Date: ${dateNL(s.date)}${s.inspector?' | Surveyed by: '+s.inspector:''}${s.reps?' | Hodaco Rep: '+s.reps:''}`,
    `CAO compliant: ${caoText(s)}`, '',
    fl.length?`Findings (${fl.length}):`:'Findings: none', ...fl.map(f=>`- ${f.label}: ${valueText(s,f)}${s.notes[f.id]?' - '+s.notes[f.id]:''}`)];
  if(nonEmpty(s.f.otherInfo)) lines.push('','Other information:',s.f.otherInfo);
  lines.push('','The full survey report is attached as PDF.');
  return lines.join('\n');
}
function openMail(s){
  const {to,cc}=recipients(s);
  if(!to.length) return toast('Kies eerst een ontvangersgroep of vul een adres in.');
  const q=[`subject=${encodeURIComponent(subject(s))}`,`body=${encodeURIComponent(mailBody(s))}`]; if(cc.length) q.unshift(`cc=${encodeURIComponent(cc.join(','))}`);
  const a=document.createElement('a'); a.href=`mailto:${to.map(encodeURIComponent).join(',')}?${q.join('&')}`; a.target='_blank'; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove();
  toast('Mail geopend. Voeg de opgeslagen PDF zelf toe als bijlage.');
}

/* ---------- PDF (mirrors the checklist layout) ---------- */
const RED=[194,65,59], INK=[19,35,58], MUTED=[91,107,128], GREEN=[31,122,92], AMBER=[217,130,43];
function makePdf(s){
  if(!window.jspdf) throw new Error('nolib');
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'}); const W=210,H=297,M=16,CW=W-2*M,LW=72,VX=M+LW+4,VW=W-M-VX; let y=0;
  const ensure=h=>{ if(y+h>H-M-6){ doc.addPage(); y=M; } };
  const setF=(size,style='normal',col=INK)=>{ doc.setFont('helvetica',style); doc.setFontSize(size); doc.setTextColor(...col); };
  const wrap=(t,w,size)=>{ doc.setFontSize(size); return doc.splitTextToSize(String(t),w); };
  // Header
  doc.setFillColor(...INK); doc.rect(0,0,W,36,'F');
  setF(9,'bold',[170,190,215]); doc.text('HOTEL SURVEY',M,12);
  setF(18,'bold',[255,255,255]); doc.text(wrap(title(s),CW-40,18)[0],M,22);
  setF(9,'normal',[200,212,228]); doc.text([s.city,dateNL(s.date),s.inspector?'Surveyed by '+s.inspector:''].filter(Boolean).join('   |   '),M,30);
  // Verdict
  const fl=flags(s); const vc = s.f.cao==='No'?RED : fl.length?AMBER : s.f.cao==='Yes'?GREEN : MUTED;
  y=44; doc.setFillColor(...vc); doc.roundedRect(M,y,CW,16,2,2,'F');
  setF(12,'bold',[255,255,255]); doc.text(`CAO compliant: ${caoText(s)}`,M+5,y+10);
  doc.text(`${fl.length} finding${fl.length===1?'':'s'}`,W-M-5,y+10,{align:'right'});
  y=64;
  const avg=avgScore(s);
  if(avg!=null){ setF(11,'bold',INK); doc.text(`Average score: ${avg.toFixed(1)} / 10`,M,y); y+=10; } else y+=4;
  const row=(label,val,{bold=false,red=false}={})=>{
    const L=wrap(label,LW,9.5), V=wrap(val||'-',VW,9.5); const h=Math.max(L.length,V.length)*4.6+2.4;
    ensure(h); setF(9.5,bold?'bold':'normal',MUTED); doc.text(L,M,y+4);
    setF(9.5,red?'bold':'normal',red?RED:(val?INK:MUTED)); doc.text(V,VX,y+4); y+=h; };
  row('Hotel name',s.hotel); row('City code',s.city); row('Hodaco Rep',s.reps);
  // Findings summary
  if(fl.length){ y+=4; ensure(12); setF(12,'bold'); doc.text('Findings',M,y+4); y+=8;
    fl.forEach(f=>{ const L=wrap(`${f.label}: ${valueText(s,f)}${s.notes[f.id]?' - '+s.notes[f.id]:''}`,CW-6,9.5); ensure(L.length*4.6+2);
      doc.setFillColor(...RED); doc.circle(M+1.2,y+2.8,1,'F'); setF(9.5,'normal'); doc.text(L,M+5,y+4); y+=L.length*4.6+1.5; }); }
  // Sections
  SECTIONS.forEach(sec=>{
    y+=5; ensure(16); doc.setDrawColor(213,221,230); doc.line(M,y,W-M,y); y+=7;
    setF(12,'bold'); doc.text(sec.name,M,y);
    const cv=sectionCompliance(s,sec); const cc=cv==='Non-compliant'?RED:cv==='Compliant'?GREEN:MUTED;
    setF(9.5,'bold',cc); doc.text(cv,W-M,y,{align:'right'}); y+=4;
    sec.fields.forEach(f=>{
      if(f.id==='otherInfo') return;
      row(f.label, valueText(s,f), {red:isFlag(s,f)});
      if(s.notes[f.id]){ const N=wrap(s.notes[f.id],VW,8.5); ensure(N.length*4+1); setF(8.5,'italic',MUTED); doc.text(N,VX,y+2.5); y+=N.length*4+1.5; }
    });
  });
  if(nonEmpty(s.f.otherInfo)){ y+=5; ensure(16); doc.line(M,y,W-M,y); y+=7; setF(12,'bold'); doc.text('Other information',M,y); y+=6;
    wrap(s.f.otherInfo,CW,10).forEach(l=>{ ensure(5); setF(10); doc.text(l,M,y); y+=5; }); }
  // Photos
  if(s.photos.length){
    doc.addPage(); y=M; setF(14,'bold'); doc.text('Photos',M,y+4); y+=10;
    const colW=(CW-6)/2; let col=0,rowH=0;
    s.photos.forEach(p=>{ let w=colW,h=w*p.h/p.w; if(h>75){h=75;w=h*p.w/p.h;}
      if(col===0) ensure(h+9); const x=M+col*(colW+6);
      try{ doc.addImage(p.data,'JPEG',x,y,w,h); }catch(e){}
      setF(8,'normal',MUTED); doc.text(SECTIONS.find(c=>c.id===p.cat)?.name||'',x,y+h+4);
      rowH=Math.max(rowH,h+9); if(col===1){y+=rowH;rowH=0;col=0;} else col=1; });
  }
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){ doc.setPage(i); setF(8,'normal',[140,150,165]); doc.text(`${title(s)} - ${dateNL(s.date)}`,M,H-8);
    doc.text('made by Pillow Report',W/2,H-8,{align:'center'}); doc.text(`${i} / ${n}`,W-M,H-8,{align:'right'}); }
  return doc.output('blob');
}
const pdfName = s=>`Pillow Report ${title(s).replace(/[\\/:*?"<>|]/g,'')} ${s.city||''} ${s.date||''}.pdf`.replace(/\s+/g,' ');

async function sharePdf(s){
  let blob; try{ blob=makePdf(s); }catch(e){ return toast('PDF maken lukt niet: de PDF-bibliotheek is niet geladen. Controleer je verbinding.'); }
  const file=new File([blob],pdfName(s),{type:'application/pdf'});
  const {to,cc}=recipients(s);
  if(to.length){ try{ await navigator.clipboard.writeText([...to,...cc].join(', ')); }catch(e){} }
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file],title:subject(s),text:mailBody(s)});
      s.status='verzonden'; touch(s); renderReport(); toast(to.length?'Gedeeld. Ontvangers staan op je klembord.':'Gedeeld.');
    }catch(e){ if(e.name!=='AbortError') toast('Delen lukt hier niet. Gebruik PDF opslaan en Mail opstellen.'); }

}

async function exportSurvey(s){
  const name=`Survey ${title(s).replace(/[\\/:*?"<>|]/g,'')} ${s.city||''} ${s.date||''}.json`.replace(/\s+/g,' ');
  const data=JSON.stringify({surveys:[s],groups:[]},null,1);
  if(downloads){ try{ await downloads.save({filename:name,data}); toast('Survey opgeslagen'); }catch(e){ if(e?.code!=='declined') toast('Opslaan lukt hier niet.'); } return; }
  const file=new File([data],name,{type:'application/json'});
  if(navigator.canShare?.({files:[file]})){ try{ await navigator.share({files:[file],title:name}); return; }catch(e){ if(e.name==='AbortError') return; } }
  const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=file.name; document.body.appendChild(a); a.click(); a.remove();
}
async function exportAll(){
  const data=JSON.stringify({surveys:S.surveys,groups:S.groups,defaultRep:S.defaultRep},null,1);
  if(downloads){ try{ await downloads.save({filename:`hotel-surveys-${today()}.json`,data}); toast('Export opgeslagen'); }catch(e){ if(e?.code!=='declined') toast('Exporteren lukt hier niet.'); } return; }
  const file=new File([data],`hotel-surveys-${today()}.json`,{type:'application/json'});
  if(navigator.canShare?.({files:[file]})){ try{ await navigator.share({files:[file]}); return; }catch(e){ if(e.name==='AbortError') return; } }
  const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=file.name; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- Boot ---------- */
(async()=>{
  await store.open();
  S.surveys=(await store.get('surveys-v2'))||[]; S.groups=(await store.get('groups'))||[]; S.defaultRep=(await store.get('defaultRep'))||'';
  const savedAutoDrive=await store.get('autoDriveTime'); S.autoDriveTime = savedAutoDrive===undefined ? true : savedAutoDrive;
  const savedAutoAddress=await store.get('autoAddress'); S.autoAddress = savedAutoAddress===undefined ? true : savedAutoAddress;
  S.googleMapsKey=(await store.get('googleMapsKey'))||'';
  const savedAutoAQ=await store.get('autoAirQuality'); S.autoAirQuality = savedAutoAQ===undefined ? true : savedAutoAQ;
  S.waqiToken=(await store.get('waqiToken'))||'';
  render();
  try{ await navigator.storage?.persist?.(); }catch(e){}
  if('serviceWorker' in navigator){
    const hadController=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').catch(()=>{});
    navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(hadController) toast('Nieuwe versie geïnstalleerd. Sluit de app en open hem opnieuw.'); });
  }
  addEventListener('online',()=>toast('Weer online'));
  addEventListener('offline',()=>toast('Offline. Je kunt gewoon doorwerken.'));
})();
</script>
