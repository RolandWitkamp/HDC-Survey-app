<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pillow Report</title>
<meta name="theme-color" content="#13233A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pillow Report">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="jspdf.umd.min.js"></script>
<style>
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
:root{
  --bg:#EDF1F5; --surface:#FFFFFF; --ink:#13233A; --muted:#5B6B80; --line:#D5DDE6;
  --accent:#0EA5E9; --accent-ink:#0B2340; --soft:#E3EBF4;
  --s0:#9AA7B6; --s1:#C2413B; --s2:#D9822B; --s3:#B8961C; --s4:#4E9A5B; --s5:#1F7A5C;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0E1621; --surface:#172231; --ink:#E6EDF5; --muted:#9AAABD; --line:#2A3A4E;
  --accent:#38BDF8; --accent-ink:#0B2340; --soft:#1E2E42;
}}
:root[data-theme="dark"]{
  --bg:#0E1621; --surface:#172231; --ink:#E6EDF5; --muted:#9AAABD; --line:#2A3A4E;
  --accent:#38BDF8; --accent-ink:#0B2340; --soft:#1E2E42;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 112px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
img{max-width:100%;display:block}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:60px}
.bar h1{font-size:1.15rem;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.home-foot{display:flex;justify-content:center;padding:28px 0 8px;opacity:.85}
.home-foot svg{width:84px;height:60px}
.brand svg{flex:none}
.icon-btn{border:0;background:none;padding:8px;margin:-8px;border-radius:8px;font-size:1.3rem;line-height:1;display:inline-flex;align-items:center;justify-content:center;color:inherit}
main{max-width:760px;margin:0 auto;padding:16px 16px 120px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 16px;font-weight:700;min-height:48px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--s1)}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;color:var(--accent);padding:4px 0;font-weight:700}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.panel h2{font-size:1.1rem;margin:0 0 4px}
.hint{color:var(--muted);font-size:.9rem;margin:0}
label.f{display:block;margin-top:12px;font-size:.9rem;color:var(--muted)}
label.f input,label.f textarea,label.f select,.inp{display:block;width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:1rem;color:var(--ink)}
textarea{resize:vertical;min-height:72px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid2>*{min-width:0}
.grid2 input,.grid2 select{max-width:100%}
.grid3{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:0 8px;margin-top:4px}
.grid3>*{min-width:0}

/* Home list */
.swipe-row{position:relative;overflow:hidden;border-radius:14px;margin-bottom:10px}
.swipe-del{position:absolute;top:0;right:0;bottom:0;width:88px;border:0;background:var(--s1);color:#fff;font-weight:700;font-size:.75rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.survey-row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:0;position:relative;z-index:1;touch-action:pan-y;transition:transform .2s}
.survey-row .t{flex:1;min-width:0}
.survey-row .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.survey-row .t span{color:var(--muted);font-size:.9rem}
.status{font-size:.8rem;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted);margin-left:6px}
.status.sent{color:var(--s5)}

/* The signature element: the score stamp */
.stamp{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.15rem;color:#fff;background:var(--s0);font-variant-numeric:tabular-nums}
.stamp.big{width:84px;height:84px;font-size:1.7rem}
.stamp[data-s="1"]{background:var(--s1)}.stamp[data-s="2"]{background:var(--s2)}.stamp[data-s="3"]{background:var(--s3)}.stamp[data-s="4"]{background:var(--s4)}.stamp[data-s="5"]{background:var(--s5)}

.summary{display:flex;align-items:center;gap:16px}
.summary .txt{flex:1}
.progress{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}

/* Category */
.cat-head{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:0;text-align:left}
.cat-head h2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{color:var(--muted);flex:none;transition:transform .15s}
.cat-head[aria-expanded="true"] .chev,.acc-head[aria-expanded="true"] .chev{transform:rotate(180deg)}
.sec-body{padding-top:10px}
.acc{border:1px solid var(--line);border-radius:10px;margin-top:10px;overflow:hidden}
.acc:first-child{margin-top:0}
.acc-head{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:var(--bg);padding:10px 12px;font-weight:700;text-align:left}
.acc-body{padding:12px}
.cat-avg{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.item{padding:14px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item-label{font-weight:700;margin-bottom:8px}
.scores{display:grid;grid-template-columns:1.3fr repeat(5,1fr);gap:6px}
.scores button{min-height:46px;border:1px solid var(--line);background:var(--bg);border-radius:9px;font-weight:700;font-size:1rem;padding:0}
.scores button.na{font-size:.8rem;font-weight:400;color:var(--muted)}
.scores button[aria-pressed="true"]{color:#fff;border-color:transparent;background:var(--s0)}
.scores button[data-v="1"][aria-pressed="true"]{background:var(--s1)}
.scores button[data-v="2"][aria-pressed="true"]{background:var(--s2)}
.scores button[data-v="3"][aria-pressed="true"]{background:var(--s3)}
.scores button[data-v="4"][aria-pressed="true"]{background:var(--s4)}
.scores button[data-v="5"][aria-pressed="true"]{background:var(--s5)}
.score-word{font-size:.85rem;color:var(--muted);margin-top:6px;min-height:1.3em}
.note{margin-top:8px}
.note[hidden]{display:none}

.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:12px}
.photo-img{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1;background:var(--soft)}
.photo-img img{width:100%;height:100%;object-fit:cover}
.photo-img button{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:1rem;line-height:1}
.photo-label{display:block;width:100%;margin-top:4px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:.8rem}
.add-photo{display:flex;align-items:center;justify-content:center;gap:8px;border:1px dashed var(--line);border-radius:10px;padding:12px;margin-top:12px;color:var(--accent);font-weight:700;cursor:pointer}
.sec-collapse{margin-top:16px;color:var(--muted)}
.add-photo input{position:absolute;width:1px;height:1px;opacity:0}

.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:10}
.dock-in{max-width:760px;margin:0 auto;display:flex;gap:10px}
.dock-in .btn{flex:1}
.dock-in .dock-photo-btn{flex:none;width:52px;padding:0;display:flex;align-items:center;justify-content:center;font-size:1.6rem;line-height:1;position:relative}
.dock-photo-btn input{position:absolute;width:1px;height:1px;opacity:0}

/* Report */
.bars{margin-top:8px}
.barrow{display:grid;grid-template-columns:minmax(110px,1.2fr) 2fr 40px;gap:10px;align-items:center;padding:6px 0;font-size:.95rem}
.barrow .track{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.barrow .track i{display:block;height:100%;border-radius:99px}
.barrow b{text-align:right;font-variant-numeric:tabular-nums}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--accent);flex:none}
.check small{display:block;color:var(--muted);word-break:break-all}
.actions{display:grid;gap:10px}
.lowlist{margin:8px 0 0;padding-left:18px}
.lowlist li{margin:4px 0}

.empty{text-align:center;padding:48px 16px}
.empty p{color:var(--muted);max-width:34ch;margin:8px auto 20px}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;max-width:min(90vw,480px);z-index:30;font-size:.95rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.modal-backdrop{position:fixed;inset:0;background:rgba(10,16,26,.5);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-backdrop[hidden]{display:none}
.modal-panel{background:var(--surface);border-radius:14px;padding:20px;max-width:400px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.modal-panel h2{font-size:1.1rem;margin:0 0 6px}
.modal-panel p{color:var(--muted);font-size:.9rem;margin:0 0 14px}
.modal-panel .actions{display:grid;gap:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:420px){.grid2{grid-template-columns:1fr}.scores{grid-template-columns:repeat(6,1fr)}.scores button.na{font-size:.7rem}}

/* Checklist fields */
.field{padding:14px 0;border-top:1px solid var(--line)}
.field:first-of-type{border-top:0}
.field-label{font-weight:700;margin-bottom:8px;display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.field-label .flagtag{font-size:.8rem;font-weight:700;color:#fff;background:var(--s1);border-radius:99px;padding:1px 8px;white-space:nowrap}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{min-height:44px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:0 14px;font-weight:700}
.opts button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opts button.bad[aria-pressed="true"]{background:var(--s1);border-color:var(--s1);color:#fff}
.opts.multi button[aria-pressed="true"]::before{content:"✓ "}
.sub{margin-top:8px}
.slider-val{font-weight:700;margin-bottom:6px}
.slider input[type=range]{width:100%;accent-color:var(--accent)}
.slider-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-top:2px}
.standard{margin-top:8px}
.standard summary{cursor:pointer;font-weight:700;font-size:.85rem;color:var(--accent);list-style:none;display:inline-flex;align-items:center;gap:4px}
.standard summary::-webkit-details-marker{display:none}
.standard summary::before{content:"ℹ️";font-size:.9em}
.standard p{margin:6px 0 0;padding:10px 12px;background:var(--soft);border-radius:10px;font-size:.85rem;color:var(--ink);line-height:1.5}
.fnote{margin-top:8px}
.fnote-head{display:flex;justify-content:flex-end}
.fnote-head .link{font-size:.85rem;padding:2px 0}
.fn-row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-top:8px}
.fn-comp{flex:none}
.ta-wrap{position:relative}
.ta-list{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;max-height:220px;overflow-y:auto;z-index:6;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.ta-list button{display:block;width:100%;text-align:left;border:0;background:none;border-top:1px solid var(--line);padding:10px 12px;font-weight:400}
.ta-list button:first-child{border-top:0}
.rest{display:grid;grid-template-columns:1fr;gap:6px;padding:8px 0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:99px;padding:6px 6px 6px 12px;font-size:.85rem;font-weight:700}
.tag button{border:0;background:none;color:var(--muted);width:18px;height:18px;line-height:1;font-size:1rem;padding:0}
.nearby-item{margin-top:10px}
.nearby-item:first-child{margin-top:0}
.chips-wrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:9;background:var(--bg);margin:0 -16px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.chips-wrap .chips{flex:1;min-width:0}
.chips-collapse{flex:none;margin-right:8px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0;padding:8px 16px;scrollbar-width:none}
.chips button{flex:none;border:0;color:var(--ink);background:var(--soft);border-radius:99px;padding:6px 12px;font-size:.85rem;white-space:nowrap}
.chips button b{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:400;margin-left:4px}
.chips button.has-flag b{color:var(--s1);font-weight:700}
.sec-meta{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums;flex:none;min-width:64px;text-align:right}
.sec-meta .fl{color:var(--s1);font-weight:700}
.stamp[data-s="ok"]{background:var(--s5)}.stamp[data-s="warn"]{background:var(--s2)}.stamp[data-s="bad"]{background:var(--s1)}
</style>
</head>
<body>
<header class="bar"><div class="bar-in" id="bar"></div></header>
<main id="app"></main>
<div class="dock" id="dock" hidden><div class="dock-in" id="dockIn"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal-backdrop" id="modalBackdrop" hidden><div class="modal-panel" id="modalPanel" role="dialog" aria-modal="true"></div></div>

<script>
/* ---------- Checklist: follows Survey_Checklist_2025 ----------
   type: text | area | choice | multi | pair | restaurants | slider | mealtimes
   detail.type: choice | search | (text, default)
   flag: answers that count as a finding (shown in red, listed in report)
   scores/compliance: optional 0-10 score and compliant/non-compliant judgement per field, set via "+ note"   */
const YN=['Yes','No'], CMP=['Compliant','Not compliant'];
const ICON={

  collapse:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11l5-5 5 5"/><path d="M7 18l5-5 5 5"/></svg>',
  share:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v14"/></svg>',
  image:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>'
};
const AIRLINES=['Aegean Airlines','Aer Lingus','Aeroflot','Aeromexico','Air Algerie','Air Astana','Air Baltic','Air Canada','Air China','Air Europa','Air France','Air India','Air New Zealand','Air Serbia','Air Transat','Alaska Airlines','Alitalia (ITA Airways)','All Nippon Airways (ANA)','American Airlines','Asiana Airlines','Austrian Airlines','Avianca','Azerbaijan Airlines','Bangkok Airways','Batik Air','British Airways','Brussels Airlines','Bulgaria Air','Cathay Pacific','Cebu Pacific','China Airlines','China Eastern Airlines','China Southern Airlines','Condor','Copa Airlines','Croatia Airlines','Delta Air Lines','EgyptAir','EL AL','Emirates','Ethiopian Airlines','Etihad Airways','Eurowings','EVA Air','Finnair','flydubai','Garuda Indonesia','Gulf Air','Hainan Airlines','Hawaiian Airlines','Hong Kong Airlines','Iberia','Icelandair','IndiGo','Japan Airlines (JAL)','Jet2','JetBlue','Jetstar Airways','Juneyao Airlines','Kenya Airways','KLM Royal Dutch Airlines','Korean Air','Kuwait Airways','LATAM Airlines','LOT Polish Airlines','Lufthansa','Luxair','Malaysia Airlines','Malta Air','Middle East Airlines','Norwegian Air','Oman Air','Pakistan International Airlines','Pegasus Airlines','Philippine Airlines','Qantas','Qatar Airways','Royal Air Maroc','Royal Brunei Airlines','Royal Jordanian','RwandAir','Ryanair','SAS Scandinavian Airlines','Saudia','Scoot','Shenzhen Airlines','Singapore Airlines','South African Airways','Southwest Airlines','SpiceJet','Spirit Airlines','SriLankan Airlines','Sun Country Airlines','Swiss International Air Lines','TAAG Angola Airlines','TAP Air Portugal','Thai Airways','Transavia','Tunisair','Turkish Airlines','Ukraine International Airlines','United Airlines','Uzbekistan Airways','Vietnam Airlines','Virgin Atlantic','Virgin Australia','Vistara','Vueling','WestJet','Wizz Air','Xiamen Airlines'];
const SECTIONS = [
  {id:'general', name:'General', fields:[
    {id:'constructionYear', label:'Construction year', type:'text', mode:'numeric'},
    {id:'renovation', label:'Last major renovation', type:'text', mode:'numeric'},

/* ---------- Storage (IndexedDB, falls back to memory) ---------- */
let shareBusy=false;
function shareGuard(payload){
  if(shareBusy){ toast('A share action is already in progress, wait a moment and try again.'); const e=new Error('busy'); e.name='AbortError'; return Promise.reject(e); }
  shareBusy=true;
  let done=false;
  const clear=()=>{ done=true; shareBusy=false; };
  return Promise.race([
    navigator.share(payload).then(v=>{ clear(); return v; }, e=>{ clear(); throw e; }),
    new Promise((_,rej)=>setTimeout(()=>{ if(!done){ clear(); const e=new Error('The share sheet did not respond.'); e.name='TimeoutError'; rej(e); } },8000))
  ]);
}
const store = {
  db:null, mem:{}, opening:null,
  open(){
    if(this.db) return Promise.resolve();
    if(this.opening) return this.opening;
    this.opening = new Promise(res=>{ try{ const r=indexedDB.open('hotel-survey',1);
      r.onupgradeneeded=()=>r.result.createObjectStore('kv');
      r.onsuccess=()=>{ this.db=r.result; this.opening=null;
        this.db.onclose=()=>{ this.db=null; };
        this.db.onversionchange=()=>{ try{this.db.close();}catch(e){} this.db=null; };
        res(); };
      r.onerror=()=>{ this.db=null; this.opening=null; res(); }; }catch(e){ this.db=null; this.opening=null; res(); } });
    return this.opening;
  },
  async get(k){
    if(!this.db) await this.open();
    if(!this.db) return this.mem[k];
    return new Promise(res=>{ try{
      const q=this.db.transaction('kv').objectStore('kv').get(k);
      q.onsuccess=()=>res(q.result); q.onerror=()=>res(this.mem[k]);
    }catch(e){ this.db=null; res(this.mem[k]); } });
  },
  async set(k,v){
    this.mem[k]=v;
    if(!this.db) await this.open();
    if(!this.db){ toast('Saving failed: storage could not be opened. Fully close the app and reopen it.'); return; }
    return new Promise(res=>{ try{
      const t=this.db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k);
      t.oncomplete=()=>res();
      t.onerror=()=>{ toast('Saving failed: this device\'s storage is full or blocked.'); res(); };
    }catch(e){ this.db=null; toast('Saving failed: fully close the app and reopen it.'); res(); } });
  }
};

async function hashText(t){
  try{
    const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){ return null; }

function filled(s,f){
  const v=s.f[f.id];
  if(f.type==='pair') return f.parts.some((_,i)=>nonEmpty(s.f[`${f.id}.${i}`]));
  if(f.type==='restaurants') return [...Array(f.rows)].some((_,i)=>nonEmpty(s.f[`${f.id}.${i}.name`]));
  if(f.type==='mealtimes') return f.meals.some((_,mi)=>f.days.some((_,di)=>nonEmpty(s.f[`${f.id}.${mi}.${di}.from`])||nonEmpty(s.f[`${f.id}.${mi}.${di}.to`])));
  if(f.type==='nearby') return (s.f[`${f.id}.selected`]||[]).length>0;
  return nonEmpty(v) || (f.extra && nonEmpty(s.f[f.id+'.extra']));
}

/* Human-readable value (used in report, mail and PDF) */
function valueText(s,f){
  const v=s.f[f.id];
  if(f.type==='pair') return f.parts.map((p,i)=>nonEmpty(s.f[`${f.id}.${i}`])?`${p}: ${s.f[`${f.id}.${i}`]}`:'').filter(Boolean).join('  |  ');
  if(f.type==='restaurants') return [...Array(f.rows)].map((_,i)=>{ const n=s.f[`${f.id}.${i}.name`]; if(!nonEmpty(n)) return ''; const m=s.f[`${f.id}.${i}.meals`]||[]; return n+(m.length?` (${m.join(', ')})`:''); }).filter(Boolean).join('\n');
  if(f.type==='slider') return nonEmpty(v) ? sliderText(f,Number(v)) : '';
  if(f.type==='nearby') return (s.f[`${f.id}.selected`]||[]).map(o=>{
    const mk=`${f.id}.${nearbySlug(o)}`, min=s.f[mk+'.minutes'], mode=s.f[mk+'.mode'];
    const extra=[nonEmpty(min)?`${min} min`:'',mode].filter(Boolean).join(', ');
    return extra?`${o} (${extra})`:o; }).join(', ');
  if(f.type==='mealtimes') return f.meals.map((meal,mi)=>{
    const parts=f.days.map((day,di)=>{ const from=s.f[`${f.id}.${mi}.${di}.from`],to=s.f[`${f.id}.${mi}.${di}.to`];
      return (nonEmpty(from)||nonEmpty(to))?`${day} ${from||'?'}-${to||'?'}`:''; }).filter(Boolean).join(', ');
    return parts?`${meal}: ${parts}`:''; }).filter(Boolean).join('\n');
  let t = Array.isArray(v)? v.join(', ') : (v||'');
  if(f.other && (Array.isArray(v)?v.includes(f.other):v===f.other) && nonEmpty(s.f[f.id+'.other'])) t+=`: ${s.f[f.id+'.other']}`;
  if(f.detail && v===f.detail.when && nonEmpty(s.f[f.id+'.detail'])){
    const dv=s.f[f.id+'.detail'];
    let dt=Array.isArray(dv)?dv.join(', '):dv;
    if(f.detail.other && Array.isArray(dv) && dv.includes(f.detail.other) && nonEmpty(s.f[f.id+'.detail.other'])) dt+=`: ${s.f[f.id+'.detail.other']}`;
    t+=` (${dt})`;
  }
  if(f.hours && v===f.hours.when){
    if(s.f[f.id+'.hours24']) t+=' [24/7]';
    else if(nonEmpty(s.f[f.id+'.hoursFrom'])||nonEmpty(s.f[f.id+'.hoursTo'])) t+=` [${s.f[f.id+'.hoursFrom']||'?'}-${s.f[f.id+'.hoursTo']||'?'}]`;
  }
  if(f.extra && nonEmpty(s.f[f.id+'.extra'])) t+=`${t?'  |  ':''}${f.extra}: ${s.f[f.id+'.extra']}`;
  return t;
}

function setDock(html){ const d=$('#dock'); if(!html){d.hidden=true;return;} d.hidden=false; $('#dockIn').innerHTML=html; }
function editDockHTML(s){
  const remaining=TOTAL-doneCount(s);
  return `<button class="btn primary" data-a="report" style="flex:1" ${remaining>0?'disabled':''}>${remaining>0?`${remaining} item${remaining===1?'':'s'} left`:'Report & share'}</button>
    <label class="btn dock-photo-btn" aria-label="Add photo">+<input type="file" accept="image/*" multiple data-photo="1"></label>`;
}
function render(){ window.scrollTo(0,0);
  ({home:renderHome,edit:renderEdit,report:renderReport,settings:renderSettings,docs:renderDocs,summary:renderSummary})[view.name](); }

function renderLock(msg){
  $('#bar').innerHTML=`<span class="brand">${ICON.mark}<h1>Pillow Report</h1></span>`;
  setDock('');
  $('#app').innerHTML = `
    <section class="panel" style="margin-top:40px">
      <h2>Locked</h2>
      <p class="hint">Enter the shared password to open Pillow Report.</p>
      <label class="f">Password<input type="password" id="lockInput" autocomplete="off" autocapitalize="off"></label>
      ${msg?`<p class="hint" style="color:var(--s1);margin-top:8px">${esc(msg)}</p>`:''}
      <button type="button" class="btn primary wide" style="margin-top:14px" data-a="unlock">Unlock</button>
    </section>`;
  const inp=$('#lockInput');
  inp?.addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });
  inp?.focus();
}
async function tryUnlock(){
  const inp=$('#lockInput'); const val=inp?.value||'';
  const hash=await hashText(val);
  if(hash && hash===S.appPasswordHash){ appUnlocked=true; render(); }
  else renderLock('Incorrect password, try again.');
}

function renderHome(){
  setBar(`<span class="brand">${ICON.mark}<h1>Pillow Report</h1></span><button class="icon-btn" data-a="settings" aria-label="Settings">${ICON.settings}</button>`);
  const list=[...S.surveys].sort((a,b)=>(b.updated||0)-(a.updated||0));
  $('#app').innerHTML = list.length ? list.map(s=>{ const v=verdict(s); return `
    <div class="swipe-row">
      <button class="swipe-del" data-a="swipedelete" data-id="${s.id}" aria-label="Delete survey">${ICON.trash}<span>Delete</span></button>
      <button class="survey-row" data-a="open" data-id="${s.id}">
        <span class="stamp" data-s="${v.k}" aria-label="${v.w}">${v.t}</span>
        <span class="t"><b>${esc(title(s))}</b>
          <span>${esc([s.city,dateNL(s.date)].filter(Boolean).join(', '))} · ${v.w}</span>
          <span class="status ${s.status==='verzonden'?'sent':''}">${s.status==='verzonden'?'Sent':'Draft'}</span></span>
      </button>
    </div>`}).join('') : `
    <div class="empty"><h2>No surveys yet</h2>
      <p>Start a survey when you arrive at the hotel. Everything is saved on this device, even offline.</p></div>`;
  $('#app').innerHTML += `<div class="home-foot">${ICON.mark}</div>`;
  setDock(`<button class="btn primary" data-a="new">New survey</button><button class="btn" data-a="summary">Summary</button>`);
}

  const s=cur(); if(!s){view={name:'home'};return render();}
  setBar(`<button class="icon-btn" data-a="home" aria-label="Back">←</button><h1>${esc(title(s))}</h1><button class="icon-btn" data-a="sharesurvey" aria-label="Export survey (backup)">${ICON.share}</button><button class="icon-btn" data-a="savephotos" aria-label="Save photos to library">${ICON.image}</button><button class="icon-btn" data-a="delete" aria-label="Delete survey">${ICON.trash}</button>`);
  const v=verdict(s);
  $('#app').innerHTML = `
    <section class="panel">
      <div class="summary"><span class="stamp big" id="ovStamp" data-s="${v.k}">${v.t}</span>
        <div class="txt"><b id="ovWord">${v.w}</b>
        <p class="hint" id="progTxt">${doneCount(s)} of ${TOTAL} items filled in</p>
        <div class="progress"><i id="progBar" style="width:${doneCount(s)/TOTAL*100}%"></i></div></div></div>
    </section>
    <div class="chips-wrap"><nav class="chips" id="chips" aria-label="Sections">${chipsHTML(s)}</nav><button type="button" class="icon-btn chips-collapse" data-a="collapseall" aria-label="Collapse all">${ICON.collapse}</button></div>
    <section class="panel" id="sec-hotel">
      <h2>Hotel</h2>
      <div class="ta-wrap"><label class="f">Hotel name<input data-top="hotel" value="${esc(s.hotel)}" autocomplete="off"></label>
        <div class="ta-list" data-hotel-suggest hidden></div>
      </div>
      <label class="f">Address<input data-top="address" value="${esc(s.address)}" placeholder="Street, city, country" autocomplete="off"></label>
      <label class="f">City code<input data-top="city" value="${esc(s.city)}" autocapitalize="characters" maxlength="3" placeholder="e.g. NBO"></label>
      <label class="f">Date</label>
      <div class="grid3">${dateSelectHTML(s)}</div>
      <label class="f">Hodaco Rep<input data-top="reps" value="${esc(s.reps)}"></label>
      <label class="f">NI Rep<input data-top="inspector" value="${esc(s.inspector)}"></label>
    </section>
    <section class="panel">
      <h2>Photos</h2>
      <p class="hint">Take or choose a photo and give it a label, e.g. Breakfast, Gym or Room 512.</p>
      <div class="photos" data-photos>${photosHTML(s)}</div>
      <label class="add-photo">📷 Add photo<input type="file" accept="image/*" multiple data-photo="1"></label>
      <button type="button" class="btn wide" style="margin-top:10px" data-a="savephotos" data-photos-save-btn ${s.photos.length?'':'hidden'}>Save photos to library</button>
    </section>
    ${SECTIONS.map(sec=>`
    <section class="panel" id="sec-${sec.id}">
      <button type="button" class="cat-head" data-a="togglesec" aria-expanded="false">
        <h2>${sec.name}</h2>
        <span class="sec-meta" data-meta="${sec.id}">${metaHTML(s,sec)}</span>
        <span class="chev">▾</span>
      </button>
      <div class="sec-body" hidden>
        ${sec.fields.map(f=>fieldHTML(s,f)).join('')}
        <label class="add-photo">📷 Add photo<input type="file" accept="image/*" multiple data-photo="1" data-photo-label="${esc(sec.name)}"></label>
        <button type="button" class="btn wide sec-collapse" data-a="closesec" data-id="${sec.id}">▴ Collapse ${esc(sec.name)}</button>
      </div>
    </section>`).join('')}`;
  setDock(editDockHTML(s));
  if(!s.f.driveTime) scheduleDriveTimeLookup(s);
}
function chipsHTML(s){ return SECTIONS.map(sec=>{ const n=sec.fields.filter(f=>isFlag(s,f)).length;
  return `<button type="button" data-a="jumpsec" data-id="${sec.id}" class="${n?'has-flag':''}">${sec.name}<b>${n?'! '+n:doneCount(s,sec.fields)+'/'+reqFields(sec.fields).length}</b></button>`; }).join(''); }
function metaHTML(s,sec){ const n=sec.fields.filter(f=>isFlag(s,f)).length;
  return `${doneCount(s,sec.fields)}/${reqFields(sec.fields).length}${n?` · <span class="fl">${n} finding${n>1?'s':''}</span>`:''}`; }

function tagPickerHTML(s,f,k,arr){
  arr=arr||[];
  const remaining=f.options.filter(o=>!arr.includes(o));
  return `<select class="inp" data-tagadd="${k}" aria-label="Add ${esc(f.label)}">
    <option value="">Choose to add…</option>
    ${remaining.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}
  </select>${arr.length?`<div class="tags">${arr.map(o=>`<span class="tag">${esc(o)}<button type="button" data-a="removetag" data-id="${k}" data-v="${esc(o)}" aria-label="Remove">×</button></span>`).join('')}</div>`:''}`;
}
function optButtons(s,f,multi){
  const v=s.f[f.id];
  return `<div class="opts ${multi?'multi':''}" role="group" aria-label="${esc(f.label)}">${f.options.map(o=>{
    const on = multi ? (v||[]).includes(o) : v===o;
    return `<button data-a="${multi?'toggle':'pick'}" data-id="${f.id}" data-v="${esc(o)}" aria-pressed="${on}" class="${f.flag?.includes(o)?'bad':''}">${esc(o)}</button>`; }).join('')}</div>`;
}
function fieldHTML(s,f){
  const k=f.id;
  if(f.type==='multi' && s.f[k]!=null && s.f[k]!=='' && !Array.isArray(s.f[k])) s.f[k]=[s.f[k]];
  if(f.detail && (f.detail.type==='search'||f.detail.type==='multi') && s.f[k+'.detail']!=null && s.f[k+'.detail']!=='' && !Array.isArray(s.f[k+'.detail'])) s.f[k+'.detail']=[s.f[k+'.detail']];
  const v=s.f[k], flagged=isFlag(s,f);
  let body='';
  if(f.type==='text') body=`<input class="inp" data-k="${k}" value="${esc(v)}" ${f.mode?`inputmode="${f.mode}"`:''} placeholder="${esc(f.ph||'')}" aria-label="${esc(f.label)}">`;
  else if(f.type==='area') body=`<textarea class="inp" data-k="${k}" rows="3" aria-label="${esc(f.label)}">${esc(v)}</textarea>`;
  else if(f.type==='pair') body=`<div class="grid2">${f.parts.map((p,i)=>`<label class="f" style="margin-top:0">${p}<input data-k="${k}.${i}" value="${esc(s.f[`${k}.${i}`])}" placeholder="${esc(f.ph)}"></label>`).join('')}</div>`;
  else if(f.type==='restaurants') body=[...Array(f.rows)].map((_,i)=>{ const m=s.f[`${k}.${i}.meals`]||[];
    return `<div class="rest"><input class="inp" data-k="${k}.${i}.name" value="${esc(s.f[`${k}.${i}.name`])}" placeholder="Restaurant ${i+1}" aria-label="Restaurant ${i+1}">
      <div class="opts multi">${f.meals.map(o=>`<button data-a="meal" data-id="${k}" data-i="${i}" data-v="${o}" aria-pressed="${m.includes(o)}">${o}</button>`).join('')}</div></div>`; }).join('');
  else if(f.type==='slider'){
    const val = nonEmpty(v) ? Number(v) : Math.round((f.min+f.max)/2/f.step)*f.step;
    body = `<div class="slider">
      <div class="slider-val" data-sliderval="${k}">${sliderText(f,val)}</div>
      <input type="range" data-k="${k}" min="${f.min}" max="${f.max}" step="${f.step}" value="${val}" aria-label="${esc(f.label)}">
      <div class="slider-labels"><span>${esc(f.left)}</span><span>${esc(f.right)}</span></div>
    </div>`;
  }
  else if(f.type==='mealtimes'){
    body = f.meals.map((meal,mi)=>{ const mk=`${k}.${mi}`;
      return `<div class="acc">
        <button type="button" class="acc-head" data-a="toggleacc" aria-expanded="false"><span>${esc(meal)}</span><span class="chev">▾</span></button>
        <div class="acc-body" hidden>
          ${f.days.map((day,di)=>{ const kf=`${mk}.${di}.from`, kt=`${mk}.${di}.to`;
            const opts=(sel)=>`<option value="" ${!s.f[sel]?'selected':''}>–</option>`+TIME_SLOTS.map(t=>`<option value="${t}" ${s.f[sel]===t?'selected':''}>${t}</option>`).join('');
            return `<div class="grid2" style="margin-top:${di===0?'0':'8px'}">
            <label class="f" style="margin-top:0">${esc(day)} from<select class="inp" data-k="${kf}">${opts(kf)}</select></label>
            <label class="f" style="margin-top:0">to<select class="inp" data-k="${kt}">${opts(kt)}</select></label>
          </div>`; }).join('')}
          <p class="hint" data-wkhint="${mi}" style="margin-top:6px" ${s.f[`${mk}.weekendAuto`]===false?'hidden':''}>Sa-Su follows Mo-Fri automatically, until you adjust Sa-Su yourself.</p>
        </div>
      </div>`; }).join('');
  }
  else if(f.type==='select'){
    body = `<select class="inp" data-k="${k}" aria-label="${esc(f.label)}">
      <option value="" ${!v?'selected':''}>Choose…</option>
      ${f.options.map(o=>`<option value="${esc(o)}" ${v===o?'selected':''}>${esc(o)}</option>`).join('')}
    </select>`;
  }
  else if(f.type==='nearby'){
    const sel=s.f[`${k}.selected`]||[];
    const remaining=f.options.filter(o=>!sel.includes(o));
    body = `<select class="inp" data-tagadd="${k}.selected" aria-label="Add ${esc(f.label)}">
        <option value="">Choose to add…</option>
        ${remaining.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}
      </select>` +
      sel.map(o=>{ const slug=nearbySlug(o), mk=`${k}.${slug}`;
        return `<div class="nearby-item">
          <div class="field-label"><span>${esc(o)}</span><button type="button" class="link" data-a="removetag" data-id="${k}.selected" data-v="${esc(o)}">Remove</button></div>
          <div class="grid2 sub">
            <label class="f" style="margin-top:0">Minutes<input class="inp" type="number" inputmode="numeric" min="0" data-k="${mk}.minutes" value="${esc(s.f[mk+'.minutes'])}"></label>
            <label class="f" style="margin-top:0">Transport<select class="inp" data-k="${mk}.mode">
              <option value="" ${!s.f[mk+'.mode']?'selected':''}>–</option>
              ${f.modes.map(m=>`<option value="${m}" ${s.f[mk+'.mode']===m?'selected':''}>${m}</option>`).join('')}
            </select></label>
          </div>
        </div>`; }).join('');
  }
  else if(f.type==='multi' && f.tagPicker) body=tagPickerHTML(s,f,k,v);
  else body=optButtons(s,f,f.type==='multi');
  const showOther = f.other && (Array.isArray(v)?v.includes(f.other):v===f.other);
  const showDetail = f.detail && v===f.detail.when;
  if(showOther) body+=`<input class="inp sub" data-k="${k}.other" value="${esc(s.f[k+'.other'])}" placeholder="Please specify">`;
  if(showDetail){
    if(f.detail.type==='choice'){
      const dv=s.f[k+'.detail'];
      body+=`<div class="opts sub" role="group" aria-label="${esc(f.detail.label||f.label)}">${f.detail.options.map(o=>{
        const on=dv===o;
        return `<button data-a="pickdetail" data-id="${k}" data-v="${esc(o)}" aria-pressed="${on}" class="${f.detail.flag?.includes(o)?'bad':''}">${esc(o)}</button>`; }).join('')}</div>`;
    } else if(f.detail.type==='search'){
      const dv=s.f[k+'.detail']||[];
      body+=`<div class="ta-wrap sub"><input class="inp" data-ta="${k}.detail" placeholder="Search or type an airline" autocomplete="off">
        <div class="ta-list" hidden></div></div>${dv.length?`<div class="tags">${dv.map(o=>`<span class="tag">${esc(o)}<button type="button" data-a="removetag" data-id="${k}.detail" data-v="${esc(o)}" aria-label="Remove">×</button></span>`).join('')}</div>`:''}`;
    } else if(f.detail.type==='multi'){
      const dv=s.f[k+'.detail']||[];
      body+=`<div class="opts multi sub" role="group" aria-label="${esc(f.detail.label||f.label)}">${f.detail.options.map(o=>{
        const on=dv.includes(o);
        return `<button data-a="toggledetail" data-id="${k}" data-v="${esc(o)}" aria-pressed="${on}">${esc(o)}</button>`; }).join('')}</div>`;
      if(f.detail.other && dv.includes(f.detail.other)) body+=`<input class="inp sub" data-k="${k}.detail.other" value="${esc(s.f[k+'.detail.other'])}" placeholder="Please specify">`;
    } else body+=`<input class="inp sub" data-k="${k}.detail" value="${esc(s.f[k+'.detail'])}" placeholder="${f.detail.label}, e.g. 06:00-23:00">`;
  }
  if(f.hours && v===f.hours.when){
    const kf=`${k}.hoursFrom`, kt=`${k}.hoursTo`, k24=`${k}.hours24`, is24=!!s.f[k24];
    const opts=(sel)=>`<option value="" ${!s.f[sel]?'selected':''}>–</option>`+TIME_SLOTS.map(t=>`<option value="${t}" ${s.f[sel]===t?'selected':''}>${t}</option>`).join('');
    body+=`<div class="sub">
      <label class="check" style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <input type="checkbox" data-hours24="${k24}" ${is24?'checked':''} style="width:18px;height:18px;margin:0;accent-color:var(--accent)"> Always open (24/7)
      </label>
      ${is24?'':`<div class="grid2">
        <label class="f" style="margin-top:0">Open from<select class="inp" data-k="${kf}">${opts(kf)}</select></label>
        <label class="f" style="margin-top:0">to<select class="inp" data-k="${kt}">${opts(kt)}</select></label>
      </div>`}
    </div>`;
  }
  if(f.extra) body+=`<label class="f">${f.extra}<input data-k="${k}.extra" value="${esc(s.f[k+'.extra'])}"></label>`;
  if(f.standard) body+=`<details class="standard"><summary>Details</summary><p>${esc(f.standard)}</p></details>`;
  if(f.id==='cao'){
    const nc=nonCompliantFields(s);
    let msg;
    if(s.caoAuto===false) msg=`Manually set. <button type="button" class="link" data-a="caoauto">Back to automatic</button>`;
    else if(nc.length) msg=`Automatically set to No based on ${nc.length} finding${nc.length===1?'':'s'}.`;
    else msg=`No findings yet. Tap Yes above once you want to confirm the survey as compliant.`;
    body+=`<p class="hint" style="margin-top:8px">${msg}</p>`;
    if(nc.length) body+=`<ul class="lowlist">${nc.map(nf=>`<li><b>${esc(nf.label)}</b>: ${esc(valueText(s,nf))}${s.notes[nf.id]?' — '+esc(s.notes[nf.id]):''}</li>`).join('')}</ul>`;
  }
  if(f.id==='driveTime'){
    let msg;
    if(!S.autoDriveTime) msg='Automatic estimation is off (see Settings).';
    else if(s.driveTimeAuto===false) msg=`Manually adjusted. <button type="button" class="link" data-a="drivetimeauto">Calculate automatically</button>`;
    else if(s.f.driveTime && s.driveTimeSource==='google') msg='Automatically calculated via Google Maps, including live traffic.';
    else if(s.f.driveTime) msg='Automatically estimated via OpenStreetMap (no live traffic).'+(s.driveTimeGoogleError?` Google Maps failed: <b>${esc(s.driveTimeGoogleError)}</b>.`:' Add a Google Maps API key in Settings for an estimate with traffic.');
    else msg=S.googleMapsKey ? 'Will be calculated automatically via Google Maps once the address and city code are filled in.' : 'Will be estimated automatically once the address and city code are filled in.';
    const canRetry=(s.address||'').trim().length>=5 && (s.city||'').trim().length===3;
    body+=`<p class="hint" style="margin-top:8px">${msg}${canRetry?` <button type="button" class="link" data-a="retrydrivetime">Try again now</button>`:''}</p>`;
  }
  if(f.id==='airQualityIndex'){
    let msg;
    const canRetry=(s.address||'').trim().length>=5;
    if(!S.waqiToken) msg='Add a free WAQI token in Settings to fetch this automatically.';
    else if(!S.autoAirQuality) msg='Automatic fetching is off (see Settings).';
    else if(s.airQualityAuto===false) msg=`Manually adjusted. <button type="button" class="link" data-a="airqualityauto">Fetch automatically</button>`;
    else if(s.f.airQualityIndex) msg='Automatically fetched via WAQI/aqicn.org (measured data from the nearest station).';
    else if(s.airQualityError) msg=`No data found: <b>${esc(String(s.airQualityError))}</b>.`;
    else msg='Will be fetched automatically once the address is filled in.';
    body+=`<p class="hint" style="margin-top:8px">${msg}${(canRetry&&S.waqiToken)?` <button type="button" class="link" data-a="retryairquality">Try again now</button>`:''}</p>`;
  }
  const note=s.notes[k], sc=s.scores[k], comp=s.compliance[k];
  const auto = !!note || flagged || sc!=null || !!comp;
  const showNote = noteOverride.has(k) ? noteOverride.get(k) : auto;
  return `<div class="field" data-field="${k}">
    <div class="field-label"><span>${esc(f.label)}</span>${flagged?'<span class="flagtag">Finding</span>':''}</div>
    ${body}
    ${showNote?`<div class="fnote">
        <div class="fnote-head"><button type="button" class="link" data-a="hidenote" data-id="${k}">Collapse note</button></div>
        <textarea class="inp note" data-note="${k}" rows="2" placeholder="${flagged?'What is not in order?':'Note'}">${esc(note)}</textarea>
        <div class="fn-row">
          <div class="opts fn-comp">
            <button data-a="pickcompliance" data-id="${k}" data-v="Compliant" aria-pressed="${comp==='Compliant'}">Compliant</button>
            <button data-a="pickcompliance" data-id="${k}" data-v="Non-compliant" aria-pressed="${comp==='Non-compliant'}" class="bad">Non-compliant</button>
          </div>
        </div>
      </div>`
      :`<button class="link" data-a="note" data-id="${k}">+ note</button>`}
  </div>`;
}
function photosHTML(s){
  return s.photos.map(p=>`<div class="photo">
    <div class="photo-img"><img src="${p.data}" alt="Photo"><button data-a="delphoto" data-pid="${p.id}" aria-label="Delete photo">×</button></div>
    <input class="photo-label" data-photolabel="${p.id}" value="${esc(p.label)}" placeholder="Label, e.g. Breakfast">
  </div>`).join('');
}
function refreshPhotosUI(s){
  const box=document.querySelector('[data-photos]'); if(box) box.innerHTML=photosHTML(s);
  const btn=document.querySelector('[data-photos-save-btn]'); if(btn) btn.hidden=!s.photos.length;
}
function dataUrlToFile(dataUrl,filename){
  const [meta,b64]=dataUrl.split(','); const mime=/data:(.*?);/.exec(meta)[1];
  const bin=atob(b64); const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new File([arr],filename,{type:mime});
}
async function savePhotosToLibrary(s,photos){
  const all=photos||s.photos;
  if(!all.length){ toast('No photos to save yet.'); return; }
  const list=all.filter(p=>!p.savedToLibrary);
  if(!list.length){ toast('These photos are already saved to the photo library.'); return; }
  const files=list.map((p,i)=>dataUrlToFile(p.data,`${(p.label||'photo').replace(/[^a-z0-9]+/gi,'-')||'photo-'+(i+1)}.jpg`));
  if(navigator.canShare?.({files})){
    try{ await shareGuard({files}); list.forEach(p=>p.savedToLibrary=true); touch(s); }
    catch(e){ if(e.name!=='AbortError') toast(`Saving failed (${e.name||'error'}: ${e.message||e}).`); }
    return;
  }
  toast('Sharing photos is not supported here (canShare said no).');
}

/* ---------- Driving time to airport (best-effort, via OpenStreetMap/OSRM) ---------- */
let airportsData=null;
async function loadAirportsData(){
  if(airportsData) return airportsData;
  const cached=await store.get('airportsData');
  if(cached){ airportsData=cached; return airportsData; }
  if(!navigator.onLine) return null;
  try{
    const res=await fetch('https://raw.githubusercontent.com/mwgg/Airports/master/airports.json');
    if(!res.ok) throw 0;
    const data=await res.json();
    airportsData=data; store.set('airportsData',data);
    return airportsData;
  }catch(e){ return null; }
}
function findAirportByIata(data,code){
  if(!data||!code) return null;
  const up=code.trim().toUpperCase();
  return Object.values(data).find(a=>a.iata===up)||null;
}
async function geocode(query){
  if(S.googleMapsKey && await loadGoogleMaps()){
    const g=await googleGeocode(query);
    if(g) return g;
  }
  const res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`);
  if(!res.ok) throw 0;
  const list=await res.json();
  if(!list.length) return null;
  return {lat:parseFloat(list[0].lat), lon:parseFloat(list[0].lon)};
}
function formatDuration(sec){
  const mins=Math.round(sec/60);
  if(mins<60) return `${mins} min`;
  const h=Math.floor(mins/60), m=mins%60;
  return `${h}h${m?' '+m+'min':''}`;
}
let driveTimer=null;
function scheduleDriveTimeLookup(s){
  clearTimeout(driveTimer);
  if(!S.autoDriveTime || s.driveTimeAuto===false) return;
  const addr=(s.address||'').trim(), code=(s.city||'').trim();
  if(addr.length<5 || code.length!==3) return;
  driveTimer=setTimeout(()=>tryFetchDriveTime(s),800);
}
let hotelSuggestTimer=null, hotelSuggestCache={viaGoogle:false,list:[]};
function scheduleHotelSuggest(s){
  clearTimeout(hotelSuggestTimer);
  const box=document.querySelector('[data-hotel-suggest]');
  const q=(s.hotel||'').trim();
  if(!S.autoAddress || q.length<3){ if(box){box.hidden=true; box.innerHTML='';} return; }
  hotelSuggestTimer=setTimeout(()=>fetchHotelSuggestions(s,q),450);
}
async function fetchHotelSuggestions(s,q){
  if(!navigator.onLine) return;
  const box=document.querySelector('[data-hotel-suggest]'); if(!box) return;
  try{
    let searchQ=q;
    const code=(s.city||'').trim();
    if(code.length===3){ const airports=await loadAirportsData(); const airport=findAirportByIata(airports,code); if(airport?.city) searchQ=`${q}, ${airport.city}`; }
    let list=[], viaGoogle=false;
    if(S.googleMapsKey && await loadGoogleMaps() && ensurePlacesServices()){
      const preds=await googlePlacePredictions(searchQ);
      if((s.hotel||'').trim()!==q) return;
      if(preds.length){ list=preds.slice(0,5); viaGoogle=true; }
    }
    if(!viaGoogle){
      const res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=5&namedetails=1&q=${encodeURIComponent(searchQ)}`);
      if(!res.ok) throw 0;
      list=await res.json();
      if((s.hotel||'').trim()!==q) return;
    }
    hotelSuggestCache={viaGoogle,list};
    if(!list.length){ box.hidden=true; box.innerHTML=''; return; }
    box.innerHTML = viaGoogle
      ? list.map((p,i)=>`<button type="button" data-a="pickhotel" data-i="${i}"><b>${esc(p.structured_formatting?.main_text||p.description)}</b><br><span class="hint">${esc(p.structured_formatting?.secondary_text||p.description)}</span></button>`).join('')
      : list.map((hit,i)=>{ const name=hit.namedetails?.name||hit.display_name.split(',')[0];
          return `<button type="button" data-a="pickhotel" data-i="${i}"><b>${esc(name)}</b><br><span class="hint">${esc(hit.display_name)}</span></button>`; }).join('');
    box.hidden=false;
  }catch(e){ box.hidden=true; }
}
let gmapsLoading=null;
function loadGoogleMaps(){
  if(window.google?.maps?.DirectionsService) return Promise.resolve(true);
  if(!S.googleMapsKey) return Promise.resolve(false);
  if(gmapsLoading) return gmapsLoading;
  gmapsLoading=new Promise(resolve=>{
    try{
      const script=document.createElement('script');
      script.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(S.googleMapsKey)}&libraries=places&loading=async`;
      script.async=true;
      script.onload=()=>resolve(!!window.google?.maps?.DirectionsService);
      script.onerror=()=>resolve(false);
      document.head.appendChild(script);
    }catch(e){ resolve(false); }
  });
  return gmapsLoading;
}
let acService=null, placesService=null;
function ensurePlacesServices(){
  if(!window.google?.maps?.places) return false;
  try{
    if(!acService) acService=new google.maps.places.AutocompleteService();
    if(!placesService) placesService=new google.maps.places.PlacesService(document.createElement('div'));
    return true;
  }catch(e){ return false; }
}
function googlePlacePredictions(query){
  return new Promise(resolve=>{
    try{ acService.getPlacePredictions({input:query, types:['lodging']}, (preds,status)=>{ resolve(status==='OK'&&preds?preds:[]); }); }
    catch(e){ resolve([]); }
  });
}
function googlePlaceDetails(placeId){
  return new Promise(resolve=>{
    try{ placesService.getDetails({placeId, fields:['name','formatted_address','geometry','rating','user_ratings_total']}, (place,status)=>{ resolve(status==='OK'?place:null); }); }
    catch(e){ resolve(null); }
  });
}
function googleGeocode(query){
  return new Promise(resolve=>{
    try{
      new google.maps.Geocoder().geocode({address:query}, (results,status)=>{
        if(status==='OK'&&results?.[0]) resolve({lat:results[0].geometry.location.lat(), lon:results[0].geometry.location.lng()});
        else resolve(null);
      });
    }catch(e){ resolve(null); }
  });
}
function googleDrivingSeconds(from,to){
  return new Promise(resolve=>{
    try{
      new google.maps.DirectionsService().route({
        origin:{lat:from.lat,lng:from.lon}, destination:{lat:to.lat,lng:to.lon},
        travelMode:google.maps.TravelMode.DRIVING,
        drivingOptions:{departureTime:new Date(),trafficModel:'bestguess'}
      }, (result,status)=>{
        const leg=status==='OK'?result?.routes?.[0]?.legs?.[0]:null;
        resolve({seconds:leg?(leg.duration_in_traffic||leg.duration).value:null, status});
      });
    }catch(e){ resolve({seconds:null, status:'EXCEPTION: '+e}); }
  });
}
async function tryFetchDriveTime(s){
  if(!S.autoDriveTime || s.driveTimeAuto===false || !navigator.onLine) return;
  const addr=(s.address||'').trim(), code=(s.city||'').trim();
  if(addr.length<5 || code.length!==3) return;
  try{
    const airports=await loadAirportsData();
    const airport=findAirportByIata(airports,code);
    if(!airport||airport.lat==null||airport.lon==null) return;
    const hotelLoc=(s.hotelLat!=null && s.hotelLon!=null) ? {lat:s.hotelLat, lon:s.hotelLon} : await geocode(addr);
    if(!hotelLoc) return;
    let dur=null, viaGoogle=false; s.driveTimeGoogleError=null;
    if(S.googleMapsKey){
      if(await loadGoogleMaps()){
        const g=await googleDrivingSeconds(hotelLoc,{lat:airport.lat,lon:airport.lon});
        if(g.seconds!=null){ dur=g.seconds; viaGoogle=true; } else { s.driveTimeGoogleError=g.status||'unknown error'; }
      } else s.driveTimeGoogleError='could not load the Google Maps library (check the key)';
    }
    if(dur==null){
      const res=await fetch(`https://router.project-osrm.org/route/v1/driving/${hotelLoc.lon},${hotelLoc.lat};${airport.lon},${airport.lat}?overview=false`);
      if(!res.ok) throw 0;
      const data=await res.json();
      dur=data?.routes?.[0]?.duration;
    }
    if(dur==null) return;
    if((s.address||'').trim()!==addr || (s.city||'').trim()!==code) return;
    s.f.driveTime=formatDuration(dur);
    s.driveTimeSource=viaGoogle?'google':'osrm';
    touch(s);
    if(view.name==='edit'&&view.id===s.id) rerenderField(s,'driveTime');
  }catch(e){ /* silently ignore: no internet, no match, or the routing service doesn't respond */ }
}

/* ---------- Air quality at destination (best-effort, via WAQI/aqicn.org) ---------- */
function aqiCategory(aqi){
  if(aqi<=50) return 'Good'; if(aqi<=100) return 'Moderate';
  if(aqi<=150) return 'Unhealthy for sensitive groups'; if(aqi<=200) return 'Unhealthy';
  if(aqi<=300) return 'Very unhealthy'; return 'Hazardous';
}
let aqiTimer=null;
function scheduleAirQualityLookup(s){
  clearTimeout(aqiTimer);
  if(!S.autoAirQuality || s.airQualityAuto===false) return;
  const addr=(s.address||'').trim(); if(addr.length<5) return;
  aqiTimer=setTimeout(()=>tryFetchAirQuality(s),800);
}
async function tryFetchAirQuality(s){
  if(!S.autoAirQuality || s.airQualityAuto===false || !navigator.onLine || !S.waqiToken) return;
  const addr=(s.address||'').trim(); if(addr.length<5) return;
  try{
    const hotelLoc=(s.hotelLat!=null && s.hotelLon!=null) ? {lat:s.hotelLat, lon:s.hotelLon} : await geocode(addr);
    if(!hotelLoc) return;
    const res=await fetch(`https://api.waqi.info/feed/geo:${hotelLoc.lat};${hotelLoc.lon}/?token=${encodeURIComponent(S.waqiToken)}`);
    if(!res.ok) throw 0;
    const data=await res.json();
    if(data.status!=='ok' || data.data?.aqi==null){ s.airQualityError=data.data||data.status; return; }
    if((s.address||'').trim()!==addr) return;
    const aqi=data.data.aqi;
    s.f.airQualityIndex=`AQI ${aqi} (${aqiCategory(aqi)})${data.data.dominentpol?' — '+data.data.dominentpol:''}`;
    s.airQualityError=null;
    touch(s);
    if(view.name==='edit'&&view.id===s.id) rerenderField(s,'airQualityIndex');
  }catch(e){ /* silently ignore */ }
}

function rerenderField(s,id){ const row=document.querySelector(`[data-field="${id}"]`); if(!row) return;
  const t=document.createElement('div'); t.innerHTML=fieldHTML(s,FIELD[id]); row.replaceWith(t.firstElementChild); }
function refreshStats(){

  const st=$('#ovStamp'); st.dataset.s=v.k; st.textContent=v.t; $('#ovWord').textContent=v.w;
  $('#progTxt').textContent=`${doneCount(s)} of ${TOTAL} items filled in`;
  $('#progBar').style.width=doneCount(s)/TOTAL*100+'%';
  $('#chips').innerHTML=chipsHTML(s);
  SECTIONS.forEach(sec=>{ const el=document.querySelector(`[data-meta="${sec.id}"]`); if(el) el.innerHTML=metaHTML(s,sec); });
  setDock(editDockHTML(s));
  if(doneCount(s)===TOTAL && !s.backupPrompted){
    s.backupPrompted=true; persist();
    if(confirm('Survey complete! Save a backup to iCloud Drive (or Files)?')) exportAll();
  }
}

    </ul></div>
  <div class="item"><b>Artikel 2b — Ligging</b>
    <p class="hint">"Een redelijke ligging t.o.v. vliegveld, winkels en recreatiemogelijkheden in voldoende veilige omgeving en rekening houdend met unieke kenmerken van de bestemming." Uitgangspunt: overnachten in of nabij het centrum van de stad; 'hotels in the middle of nowhere' worden voorkomen. Lokale omstandigheden (veiligheid, ontbreken van één centraal centrum, onevenredig lange reistijd van/naar het vliegveld) kunnen aanleiding zijn voor een alternatieve locatie. Op basis van redelijkheid en argumenten kan hiervan worden afgeweken.</p></div>
  <div class="item"><b>Artikel 2c — Service door hotelpersoneel</b>
    <ul class="lowlist">
      <li>Dinertijden: crews die met de vroege vlucht vertrekken moeten de avond voorafgaand tussen 17.00-19.00 uur LT kunnen dineren (of partijen komen onderling tot een alternatief).</li>
      <li>Ontbijttijden Europa: het hotel regelt een ontbijt voor de vroegst vertrekkende crew, ook buiten de reguliere ontbijttijden.</li>
      <li>Oostelijk gelegen stations: bij een tijdsverschil van 5 uur of meer, ontbijt tot 15:00 lokale tijd op rekening van KLM. Kan dit niet, dan wordt een ontbijtvergoeding in het daggeld opgenomen.</li>
    </ul></div>
  <div class="item"><b>Artikel 2d — Kwaliteitsniveau</b>
    <p class="hint">"Een kwaliteitsniveau dat overeenkomt met dat van de bekende internationale hotelketens."</p></div>
  <div class="item"><b>Artikel 2e — Sportfaciliteiten</b>
    <p class="hint">"Sportfaciliteiten dienen in het hotel aanwezig te zijn. Het materiaal dient een veilige sport uitvoering mogelijk te maken, van deugdelijke kwaliteit te zijn en in voldoende mate aanwezig te zijn." Een fitnessruimte is voldoende uitgerust als er cardiomachines én minstens één fitnessapparaat en/of carrousel met gewichten aanwezig zijn, rekening houdend met de omvang van het hotel en de omvang van de aanwezige crew.</p></div>
</section>

<section class="panel">
  <h2>Safety &amp; Security</h2>
  <ul class="lowlist">
    <li>De geldende Europese wet- en regelgeving (86/666/EEC) aangaande brandveiligheid dient aangehouden te worden. Maken lokale omstandigheden dit onmogelijk, dan treedt overleg met de SCO in werking voor mitigerende maatregelen.</li>
    <li>De deur van een kamer dient ofwel een peephole óf een ketting/looplock te hebben.</li>
    <li>Deuren in kamers met een connecting door dienen aan beide zijden een slot te hebben.</li>
    <li>Evacuatieplan dient in kamers op of nabij de kamerdeur te hangen.</li>
    <li>Smokedetectors en/of sprinklers dienen óf op kamerniveau óf in de gang waaraan de kamers grenzen aanwezig te zijn.</li>
    <li>Nooduitgangen en evacuatieroute dienen duidelijk aangegeven te zijn en voorzien van noodverlichting; uitgangen en route dienen vrij van obstakels te zijn.</li>
  </ul>
</section>

<section class="panel">
  <h2>Daggelden</h2>
  <p class="hint">Het daggeld wordt herberekend: als de daggeldsheets ouder dan 4 jaar zijn bij een contractverlenging, of bij een structurele verhuizing naar een ander hotel.</p>
  <div class="item"><b>Artikel 2b — Grondslag vergoedingen</b>
    <p class="hint">"Deze vergoedingen worden bepaald op grond van de prijzen (incl. fooien en belasting) van het hotel van verblijf en — afhankelijk van de omstandigheden — zo mogelijk drie plaatselijke restaurants van voldoende kwaliteit."</p>
    <ul class="lowlist">
      <li>Tip op NAD zit inbegrepen in de kamerprijs (ontbijt) en wordt niet apart uitgekeerd in het daggeld. Wordt er wél daggeld uitgekeerd, dan 20% (USA) / 18% (CAN) tip.</li>
      <li>In hotels en bij buitenrestaurants worden in principe drie representatieve restaurants meegenomen (voorkeur: keuze in overleg tussen Procurement en Hodaco).</li>
      <li>Representatief = niet de goedkoopste/duurste, geen sterrenrestaurants, sitdown met bediening (geen fastfood/afhaal), op een centrale plek.</li>
      <li>All day dining menu wordt standaard meegenomen. Is ontbijt niet in de kamerprijs inbegrepen, dan alleen hotel-restaurants meegenomen; is er geen cao-compliant ontbijt, dan drie buitenrestaurants.</li>
    </ul></div>
  <div class="item"><b>Artikel 3a — Normen maaltijden</b>
    <ul class="lowlist">
      <li><b>Ontbijt:</b> vruchtensap, 2 eieren met ham, brood, boter en thee of koffie.</li>
      <li><b>Lunch:</b> eenvoudige schotel en koffie.</li>
      <li><b>Diner:</b> soep, hoofdschotel, dessert en koffie.</li>
    </ul>
    <p class="hint">Bij lokale omstandigheden kunnen i.p.v. vergoeding één of meer maaltijden in natura worden verstrekt. All inclusive is uitgesloten tenzij anders besloten.</p></div>
  <div class="item"><b>Artikel 4b — Sundries (basis 24 uur)</b>
    <ul class="lowlist">
      <li><b>Dranken:</b> koffie op basis van filter/americain; bier op basis van een normaal tapbiertje; standaard prijzen buitenrestaurants (anders hotelprijzen).</li>
      <li><b>Ontspanning:</b> gemiddelde toegangsprijs bioscoop (reguliere doordeweekse avondvoorstelling), zwembad en sportgelegenheid. Zwembad = bad om in te zwemmen (geen jacuzzi/bubbelbad). Binnenzwembad, of buitenzwembad dat 's winters niet open is: pro rato vergoeding. Geen fitness/zwembad (ook niet publiek) beschikbaar: geen vergoeding.</li>
      <li><b>Plaatselijk transport:</b> bij geen kosteloos vervoer — 4 bus-/tramritten, of (geen/onvoldoende OV) 50% van een retourrit hotel-stad per taxi.</li>
      <li><b>Fooien:</b> 1 dollar fooi voor housekeeping en/of chauffeurs als vermeld in de CDI; geldt voor alle stations binnen geografisch Afrika.</li>
    </ul></div>
</section>

<section class="panel">
  <h2>Berekeningsgrondslagen daggeld</h2>
  <ul class="lowlist">
    <li>Movie: toegangsbewijs bioscoop, geen "pay-tv". Sport: gedeeld door 3 (movie/zwembad/sport), tenzij pool+sport in één faciliteit voor 1 bedrag — dan gedeeld door 2.</li>
    <li>Vervoer: 4x prijs OV bij geen gratis shuttle; anders one-way taxirit hotel-centrum.</li>
    <li>Ontbijt/lunch/diner-normen: appetizers, schaal-/schelpdieren (bijv. kreeft) en roomservice worden niet meegerekend. Dure/exclusieve restaurants, buffetten/set-menu's en ontoereikende barmenu's tellen niet mee. Korting wordt met een maximum van 30% berekend.</li>
    <li>Vegetarische, nasi/bami/oriëntaalse, pasta- en pizzagerechten tellen mee; bij small/medium/large alleen medium; bij Oosterse keuken telt rijst altijd mee; steak tot 250 gram; ijs per bolletje: 2 bolletjes per dessert.</li>
  </ul>
</section>

<section class="panel">
  <h2>Algemene afspraken</h2>
  <div class="item"><b>Tijdelijk hotel</b>
    <p class="hint">Bij een tijdelijke hotelwissel korter dan één maand wordt het daggeld niet herberekend (het reguliere daggeld blijft gelden), tenzij zwaarwegende argumenten. Wordt een deel van de crew door onvoorziene redenen tijdelijk elders ondergebracht, dan geldt voor hen ook het daggeld van het reguliere hotel.</p></div>
  <div class="item"><b>Survey-proces</b>
    <p class="hint">Bij een nieuwe bestemming, serieuze aanhoudende klachten, of andere redenen om van crewhotel te veranderen, vindt een survey plaats. Hieraan nemen vertegenwoordigers van GC Vliegers en GC Cabine deel (voor KLC: Groepscommissie). In onderling overleg kan ook zonder survey een keuze worden gemaakt.</p>
    <ul class="lowlist">
      <li>Circa 6 maanden voor afloop van het contract / opstarten nieuw station start Procurement het marktonderzoek (RFP naar hotels; Hodaco kan ook hotels aandragen).</li>
      <li>AK (Health Services) en AV (Security Services) worden waar relevant geïnformeerd en om informatie gevraagd.</li>
      <li>Zonder alternatieve opties: Procurement stelt een decision sheet voor om het huidige contract te verlengen.</li>
      <li>Bij voldoende reacties: longlist → shortlist (o.b.v. lokale situatie, AK/AV-input, feedback crew via trip reports) → voorgelegd aan BVD, beoordeeld op de driehoek: cao-compliance, kosten efficiency en crewbeleving.</li>
      <li>Na akkoord op de shortlist wordt Hodaco min. 7 weken van tevoren geïnformeerd over de surveydata; Hodaco regelt zelf het rooster met P&amp;A.</li>
      <li>Na de survey informeert Procurement AK en AV; op basis van AK-/AV-rapport en Hodaco-advies neemt de BVD het besluit, bekrachtigd in het BVD-Hodaco-overleg. Crew Facilities verzorgt de verslaglegging.</li>
    </ul></div>
</section>

<section class="panel">
  <h2>Bijlage 1 — Uitwisseling KLC-KLM stations</h2>
  <ul class="lowlist">
    <li><b>Overgang KLC → KLM:</b> KLM gaat 1-op-1 over naar het KLC-hotel (identieke cao-delen).</li>
    <li><b>Overgang KLM → KLC:</b> KLC gaat 1-op-1 over naar het KLM-hotel (identieke cao-delen).</li>
    <li><b>Nieuw af te sluiten contracten:</b> de startende carrier leidt het surveyproces. Bij te verlengen Europese contracten: de carrier die het voorafgaande jaar de voornaamste afnemer van hotelkamers was. Groepscommissie 51 en Hodaco overleggen hierover; de bedrijfsleiding van de betreffende carrier neemt (na advies) de eindbeslissing, gedeeld met BVD/Hodaco resp. KLC Flight Operations/Groepscommissie 51.</li>
  </ul>
</section>

<section class="panel">
  <h2>Openstaand punt (geen overeenstemming)</h2>
  <p class="hint">Bijlage 13, 4.2: Sundries bestaan uit zwembad, gym en bioscoop. Bij de cao-aanpassing 2018-2019 ('Sportfaciliteiten dienen in het hotel aanwezig te zijn') is geen afspraak gemaakt over hoe sundries te berekenen in de nieuwe situatie. Procurement: de gym komt 'op 0' te staan, sundries gedeeld door 3 (huidige werkwijze). Hodaco: sundries dienen door 2 gedeeld te worden. Partijen komen hier niet uit; Hodaco stuurt input, de huidige manier blijft vooralsnog uitgevoerd worden.</p>
</section>

/* ---------- Swipe to delete (home list) ---------- */
const SWIPE_W=88;
let swipe=null, suppressClick=false;
function closeSwipes(){ document.querySelectorAll('.swipe-row.open').forEach(w=>{ w.classList.remove('open'); w.querySelector('.survey-row').style.transform=''; }); }
function swipeStart(x,y,target){
  const row=target.closest('.survey-row'); const wrap=row?.closest('.swipe-row'); if(!wrap) return;
  document.querySelectorAll('.swipe-row.open').forEach(w=>{ if(w!==wrap){ w.classList.remove('open'); w.querySelector('.survey-row').style.transform=''; } });
  const wasOpen=wrap.classList.contains('open');
  swipe={row,wrap,startX:x,startY:y,dragging:false,base:wasOpen?-SWIPE_W:0,x:wasOpen?-SWIPE_W:0};
}
function swipeMove(x,y){
  if(!swipe) return;
  const dx=x-swipe.startX, dy=y-swipe.startY;
  if(!swipe.dragging){
    if(Math.abs(dy)>Math.abs(dx)){ swipe=null; return; }
    if(Math.abs(dx)<8) return;
    swipe.dragging=true; swipe.row.style.transition='none';
  }
  swipe.x=Math.max(-SWIPE_W-16,Math.min(0,swipe.base+dx));
  swipe.row.style.transform=`translateX(${swipe.x}px)`;
}
function swipeEnd(){
  if(!swipe) return;
  const {row,wrap,dragging,x}=swipe;
  row.style.transition='';
  if(dragging){
    const openNow = x < -SWIPE_W/2;
    row.style.transform = openNow? `translateX(-${SWIPE_W}px)` : '';
    wrap.classList.toggle('open',openNow);
    suppressClick=true; setTimeout(()=>suppressClick=false,0);
  }
  swipe=null;
}
if('ontouchstart' in window){
  document.addEventListener('touchstart', e=>{ const t=e.touches[0]; swipeStart(t.clientX,t.clientY,e.target); }, {passive:true});
  document.addEventListener('touchmove', e=>{ const t=e.touches[0]; swipeMove(t.clientX,t.clientY); }, {passive:true});
  document.addEventListener('touchend', swipeEnd);
} else {
  document.addEventListener('mousedown', e=>swipeStart(e.clientX,e.clientY,e.target));
  document.addEventListener('mousemove', e=>swipeMove(e.clientX,e.clientY));
  document.addEventListener('mouseup', swipeEnd);
}
document.addEventListener('click', e=>{
  if(e.target.id==='modalBackdrop') hideModal();
  if(!e.target.closest('.swipe-row')) closeSwipes();
  if(!e.target.closest('.ta-wrap')) document.querySelectorAll('.ta-list').forEach(b=>b.hidden=true);
});

function nonCompliantFields(s){ return ALL.filter(f=>f.id!=='cao' && (isFlag(s,f) || s.compliance?.[f.id]==='Non-compliant')); }
function updateCaoAuto(s){
  if(s.caoAuto===false) return false;
  const bad=nonCompliantFields(s).length>0;
  if(bad && s.f.cao!=='No'){ s.f.cao='No'; return true; }
  if(!bad && s.f.cao==='No'){ delete s.f.cao; return true; }
  return false;
}
function touch(s){ s.updated=Date.now(); const changed=updateCaoAuto(s); persist(); if(changed && view.name==='edit' && view.id===s.id) rerenderField(s,'cao'); }
function compress(file){ return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file); const img=new Image();
  img.onload=()=>{ const max=1280; let w=img.naturalWidth,h=img.naturalHeight; const r=Math.min(1,max/Math.max(w,h)); w=Math.round(w*r); h=Math.round(h*r);
    const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(url);
    res({data:c.toDataURL('image/jpeg',0.7),w,h}); };
  img.onerror=()=>{URL.revokeObjectURL(url);rej()}; img.src=url; }); }

/* ---------- Recipients & mail ---------- */
function recipients(s){
  const split=v=>(v||'').split(/[,;\s]+/).map(x=>x.trim()).filter(Boolean);
  const gs=S.groups.filter(g=>s.recip?.groups.includes(g.id));
  const to=[...new Set([...gs.flatMap(g=>split(g.to)),...split(s.recip?.extra)])];
  const cc=[...new Set(gs.flatMap(g=>split(g.cc)))].filter(x=>!to.includes(x));
  return {to,cc};
}
const caoText = s=>s.f.cao==='Yes'?'Yes':s.f.cao==='No'?'No':'Not assessed';
function subject(s){ return `Pillow Report ${title(s)}${s.city?' ('+s.city+')':''} - ${dateNL(s.date)}`; }
function mailBody(s){
  const fl=flags(s);
  const lines=[`Pillow Report: ${title(s)}${s.city?' ('+s.city+')':''}`,
    `Date: ${dateNL(s.date)}${surveyedBy(s)?' | Surveyed by: '+surveyedBy(s):''}`,
    `CAO compliant: ${caoText(s)}`, '',
    fl.length?`Findings (${fl.length}):`:'Findings: none', ...fl.map(f=>`- ${f.label}: ${valueText(s,f)}${s.notes[f.id]?' - '+s.notes[f.id]:''}`)];
  if(nonEmpty(s.f.otherInfo)) lines.push('','Other information:',s.f.otherInfo);
  lines.push('','The full survey report is attached as PDF.');
  return lines.join('\n');
}
function openMail(s){
  const {to,cc}=recipients(s);
  if(!to.length) return toast('Choose a recipient group or add an address first.');
  const q=[`subject=${encodeURIComponent(subject(s))}`,`body=${encodeURIComponent(mailBody(s))}`]; if(cc.length) q.unshift(`cc=${encodeURIComponent(cc.join(','))}`);
  const a=document.createElement('a'); a.href=`mailto:${to.map(encodeURIComponent).join(',')}?${q.join('&')}`; a.target='_blank'; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove();
  toast('Mail opened. Add the saved PDF as an attachment yourself.');
}

const RED=[194,65,59], INK=[19,35,58], MUTED=[91,107,128], GREEN=[31,122,92], AMBER=[217,130,43], KLMBLUE=[0,161,222];
function makePdf(s){
  if(!window.jspdf) throw new Error('nolib');
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'}); const W=210,H=297,M=16,CW=W-2*M,LW=72,VX=M+LW+4,VW=W-M-VX; let y=0;
  const ensure=h=>{ if(y+h>H-M-6){ doc.addPage(); y=M; } };
  const setF=(size,style='normal',col=INK)=>{ doc.setFont('helvetica',style); doc.setFontSize(size); doc.setTextColor(...col); };
  const wrap=(t,w,size)=>{ doc.setFontSize(size); return doc.splitTextToSize(String(t),w); };
  // Header
  doc.setFillColor(...KLMBLUE); doc.rect(0,0,W,36,'F');
  setF(9,'bold',[170,190,215]); doc.text('HOTEL SURVEY',M,12);
  setF(18,'bold',[255,255,255]); doc.text(wrap(title(s),CW-40,18)[0],M,22);
  setF(9,'normal',[200,212,228]); doc.text([s.city,dateNL(s.date),surveyedBy(s)?'Surveyed by '+surveyedBy(s):''].filter(Boolean).join('   |   '),M,30);
  // Verdict
  const fl=flags(s); const vc = s.f.cao==='No'?RED : fl.length?AMBER : s.f.cao==='Yes'?GREEN : MUTED;
  y=44; doc.setFillColor(...vc); doc.roundedRect(M,y,CW,16,2,2,'F');
  setF(12,'bold',[255,255,255]); doc.text(`CAO compliant: ${caoText(s)}`,M+5,y+10);
  doc.text(`${fl.length} finding${fl.length===1?'':'s'}`,W-M-5,y+10,{align:'right'});
  y=64;
  const avg=avgScore(s);
  if(avg!=null){ setF(11,'bold',INK); doc.text(`Average score: ${avg.toFixed(1)} / 10`,M,y); y+=10; } else y+=4;
  const row=(label,val,{bold=false,red=false}={})=>{
    const L=wrap(label,LW,9.5), V=wrap(val||'-',VW,9.5); const h=Math.max(L.length,V.length)*4.6+2.4;
    ensure(h); setF(9.5,bold?'bold':'normal',MUTED); doc.text(L,M,y+4);
    setF(9.5,red?'bold':'normal',red?RED:(val?INK:MUTED)); doc.text(V,VX,y+4); y+=h; };
  row('Hotel name',s.hotel); row('City code',s.city); row('Hodaco Rep',s.reps); row('NI Rep',s.inspector);
  // Findings summary
  if(fl.length){ y+=4; ensure(12); setF(12,'bold'); doc.text('Findings',M,y+4); y+=8;
    fl.forEach(f=>{ const L=wrap(`${f.label}: ${valueText(s,f)}${s.notes[f.id]?' - '+s.notes[f.id]:''}`,CW-6,9.5); ensure(L.length*4.6+2);
      doc.setFillColor(...RED); doc.circle(M+1.2,y+2.8,1,'F'); setF(9.5,'normal'); doc.text(L,M+5,y+4); y+=L.length*4.6+1.5; }); }
  // Sections
  SECTIONS.forEach(sec=>{
    y+=5; ensure(16); doc.setDrawColor(213,221,230); doc.line(M,y,W-M,y); y+=7;
    setF(12,'bold'); doc.text(sec.name,M,y);
    const cv=sectionCompliance(s,sec); const cc=cv==='Non-compliant'?RED:cv==='Compliant'?GREEN:MUTED;
    setF(9.5,'bold',cc); doc.text(cv,W-M,y,{align:'right'}); y+=4;
    sec.fields.forEach(f=>{
      if(f.id==='otherInfo') return;
      row(f.label, valueText(s,f), {red:isFlag(s,f)});
      if(s.notes[f.id]){ const N=wrap(s.notes[f.id],VW,8.5); ensure(N.length*4+1); setF(8.5,'italic',MUTED); doc.text(N,VX,y+2.5); y+=N.length*4+1.5; }
    });
  });
  if(nonEmpty(s.f.otherInfo)){ y+=5; ensure(16); doc.line(M,y,W-M,y); y+=7; setF(12,'bold'); doc.text('Other information',M,y); y+=6;
    wrap(s.f.otherInfo,CW,10).forEach(l=>{ ensure(5); setF(10); doc.text(l,M,y); y+=5; }); }
  // Photos
  if(s.photos.length){
    doc.addPage(); y=M; setF(14,'bold'); doc.text('Photos',M,y+4); y+=10;
    const colW=(CW-6)/2; let col=0,rowH=0;
    s.photos.forEach(p=>{ let w=colW,h=w*p.h/p.w; if(h>75){h=75;w=h*p.w/p.h;}
      if(col===0) ensure(h+9); const x=M+col*(colW+6);
      try{ doc.addImage(p.data,'JPEG',x,y,w,h); }catch(e){}
      setF(8,'normal',MUTED); doc.text(p.label||'Photo',x,y+h+4);
      rowH=Math.max(rowH,h+9); if(col===1){y+=rowH;rowH=0;col=0;} else col=1; });
  }
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){ doc.setPage(i); setF(8,'normal',[140,150,165]); doc.text(`${title(s)} - ${dateNL(s.date)}`,M,H-8);
    doc.text('made by Pillow Report',W/2,H-8,{align:'center'}); doc.text(`${i} / ${n}`,W-M,H-8,{align:'right'}); }
  return doc.output('blob');
}
const pdfName = s=>`Pillow Report ${title(s).replace(/[\\/:*?"<>|]/g,'')} ${s.city||''} ${s.date||''}.pdf`.replace(/\s+/g,' ');

function makeSummaryPdf(){

  const ensure=h=>{ if(y+h>H-M-6){ doc.addPage(); y=M; } };

async function saveWord(s){
  const blob=new Blob(['﻿'+makeWordHtml(s)],{type:'application/msword'});
  if(downloads){ try{ await downloads.save({filename:wordName(s),data:blob}); toast('Word document saved'); }catch(e){ if(e?.code!=='declined') toast('Saving does not work here. Use Share instead.'); } return; }
  const file=new File([blob],wordName(s),{type:'application/msword'});
  if(/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1)){
    if(navigator.canShare?.({files:[file]})){ try{ await shareGuard({files:[file]}); }catch(e){} return; }
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=wordName(s); document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
async function exportSurvey(s){
  const name=`Survey ${title(s).replace(/[\\/:*?"<>|]/g,'')} ${s.city||''} ${s.date||''}.json`.replace(/\s+/g,' ');
  const data=JSON.stringify({surveys:[s],groups:[]},null,1);
  if(downloads){ try{ await downloads.save({filename:name,data}); toast('Survey saved'); }catch(e){ if(e?.code!=='declined') toast('Saving does not work here.'); } return; }
  const file=new File([data],name,{type:'application/json'});
  if(navigator.canShare?.({files:[file]})){ try{ await shareGuard({files:[file],title:name}); return; }catch(e){ if(e.name==='AbortError') return; } }
  const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=file.name; document.body.appendChild(a); a.click(); a.remove();
}
async function exportAll(){
  const data=JSON.stringify({surveys:S.surveys,groups:S.groups,defaultRep:S.defaultRep},null,1);
  if(downloads){ try{ await downloads.save({filename:`hotel-surveys-${today()}.json`,data}); toast('Export saved'); }catch(e){ if(e?.code!=='declined') toast('Exporting does not work here.'); } return; }
  const file=new File([data],`hotel-surveys-${today()}.json`,{type:'application/json'});
  if(navigator.canShare?.({files:[file]})){ try{ await shareGuard({files:[file]}); return; }catch(e){ if(e.name==='AbortError') return; } }
  const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=file.name; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- Boot ---------- */
(async()=>{
  await store.open();
  S.surveys=(await store.get('surveys-v2'))||[]; S.groups=(await store.get('groups'))||[]; S.defaultRep=(await store.get('defaultRep'))||'';
  const savedAutoDrive=await store.get('autoDriveTime'); S.autoDriveTime = savedAutoDrive===undefined ? true : savedAutoDrive;
  const savedAutoAddress=await store.get('autoAddress'); S.autoAddress = savedAutoAddress===undefined ? true : savedAutoAddress;
  const savedGMKey=await store.get('googleMapsKey'); S.googleMapsKey = savedGMKey===undefined ? DEFAULT_GOOGLE_MAPS_KEY : savedGMKey;
  const savedAutoAQ=await store.get('autoAirQuality'); S.autoAirQuality = savedAutoAQ===undefined ? true : savedAutoAQ;
  const savedWaqi=await store.get('waqiToken'); S.waqiToken = savedWaqi===undefined ? DEFAULT_WAQI_TOKEN : savedWaqi;
  const savedAutoSavePhotos=await store.get('autoSavePhotos'); S.autoSavePhotos = savedAutoSavePhotos===undefined ? true : savedAutoSavePhotos;
  S.appPasswordHash=(await store.get('appPasswordHash'))||'';
  S.summary=(await store.get('summary'))||'';
  if(S.appPasswordHash && !appUnlocked) renderLock(); else render();
  try{ await navigator.storage?.persist?.(); }catch(e){}
  if('serviceWorker' in navigator){
    const hadController=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.register(`sw.js?v=${APP_VERSION}`).then(reg=>{ reg.update().catch(()=>{}); }).catch(()=>{});
    navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(hadController) toast('New version installed. Close the app and reopen it.'); });
  }
  addEventListener('online',()=>toast('Back online'));
  addEventListener('offline',()=>toast('Offline. You can keep working as normal.'));
})();
</script>
